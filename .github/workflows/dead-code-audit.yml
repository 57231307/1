# ==============================================================================
# 死代码全量审计 workflow
#
# 用途：定期审计 backend/src 下所有 #![allow(dead_code)] 抑制项，
#      确认每条抑制都"必要"且"接入业务或带 TODO"。
#
# 触发：
#   - 定时：每周一 UTC 01:00（北京时间 09:00）
#   - 手动：Actions 页面 "Run workflow"（可选 strict 严格模式）
#   - PR：PR 关闭/合并时跑一次
#
# 不阻塞主 CI/CD 流程（独立 workflow）。
#
# 2026-09-22 去重：本 job 原先逐行复刻了 ci-cd.yml 的 ci-dead-code-audit
# （剥离规则 / cargo check / 报告 / 计数口径两份各写一遍，已经开始漂移）。
# 审计流程本体现在只有一份实现：./.github/actions/dead-code-audit。
# 两个调用方各自保留"语义差异"：
#   · 本 workflow（周报/手动）：fail-on-warnings: 'false' ⇒ 只出报告/开 issue，
#     只有 strict 手动触发时才判失败（与合并前一致）
#   · ci-cd.yml ci-dead-code-audit（PR 门禁）：fail-on-warnings: 'true' ⇒ 有警告即红
# artifact 名沿用本 workflow 历史上的 dead-code-audit-report-${run_id}（保留 90 天），
# 与门禁 job 的 dead-code-audit-${run_id} 各自不变。
# ==============================================================================
name: 死代码全量审计

on:
  # 定时任务：每周一 UTC 01:00（北京时间 09:00）
  schedule:
    - cron: '0 1 * * 1'
  # 手动触发
  workflow_dispatch:
    inputs:
      strict:
        description: '严格模式：警告数未降低则失败'
        required: false
        type: boolean
        default: false
  # PR 关闭时跑一次（reviewers 可手动 review 报告）
  pull_request:
    types: [closed]
    branches:
      - main
      - master

# 关闭默认并发限制：审计任务可并行跑多次
concurrency:
  group: dead-code-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.94.1
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: 死代码审计
    runs-on: ubuntu-latest
    # 全量 cargo check --all-targets 冷缓存耗时长，预留充足窗口
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write  # 失败时创建 issue
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 复用共享复合动作：与主 CI 共用 rustup-/cargo- 缓存键（已预热），
      # 智能内存探测设 CARGO_BUILD_JOBS 防 OOM，sccache 关闭 + 7GB/单元
      # 与 Clippy job 同款 --all-targets 内存配置。
      # fail-on-warnings 传 false：本 workflow 历史上只是"报告型"，
      # 判失败交给下面的 strict 步骤（保持原门禁语义）。
      - name: 死代码审计（剥离抑制 → cargo check → 报告 → 上传）
        id: audit
        uses: ./.github/actions/dead-code-audit
        with:
          artifact-name: dead-code-audit-report-${{ github.run_id }}
          retention-days: '90'
          fail-on-warnings: 'false'

      - name: 写报告到 job summary
        if: always()
        run: |
          if [ -f /tmp/audit-report.md ]; then
            cat /tmp/audit-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 严格模式：警告数未降低则失败
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.strict == 'true' &&
          steps.audit.outputs.warning_count != '0'
        run: |
          echo "❌ 严格模式：发现 ${{ steps.audit.outputs.warning_count }} 处 dead_code，请处理后再跑"
          exit 1

      - name: 自动创建 issue（仅定时任务）
        if: >-
          github.event_name == 'schedule' &&
          steps.audit.outputs.warning_count != '0' &&
          steps.audit.outputs.warning_count != ''
        uses: actions/github-script@v7
        env:
          WARNING_COUNT: ${{ steps.audit.outputs.warning_count }}
          AFFECTED_FILES: ${{ steps.audit.outputs.affected_files }}
          BEFORE_COUNT: ${{ steps.audit.outputs.before_count }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/audit-report.md', 'utf8');

            // 检查今天是否已创建过 issue（避免重复刷屏）
            const today = new Date().toISOString().slice(0, 10);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tech-debt,dead-code-audit',
              per_page: 10
            });
            const todayIssues = issues.filter(i =>
              i.title.includes(today) ||
              (i.body && i.body.includes(`## 概览`) && i.created_at.startsWith(today))
            );

            if (todayIssues.length > 0) {
              // 今日已有 issue，改为评论
              const existing = todayIssues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `## 再次审计（${today}）\n\n${report}\n\n---\n本次警告数: ${process.env.WARNING_COUNT}，受影响文件: ${process.env.AFFECTED_FILES}`
              });
              console.log(`已更新 issue #${existing.number}`);
              return;
            }

            // 创建新 issue
            const title = `死代码审计 - ${today}（${process.env.WARNING_COUNT} 条警告）`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: report + `\n\n---\n*本 issue 由 CI 自动创建。每周一自动更新。*`,
              labels: ['tech-debt', 'dead-code-audit']
            });
            console.log(`已创建 issue: ${title}`);

      - name: 完成
        if: always()
        run: |
          echo "=========================================="
          echo "  死代码审计完成"
          echo "=========================================="
          echo ""
          echo "审计前 file-level allow: ${{ steps.audit.outputs.before_count }}"
          echo "审计后 dead_code 警告: ${{ steps.audit.outputs.warning_count }}"
          echo "受影响文件: ${{ steps.audit.outputs.affected_files }}"
          echo ""
          if [ "${{ steps.audit.outputs.warning_count }}" -eq "0" ]; then
            echo "✅ 无死代码，可考虑删除所有 file-level allow"
          else
            echo "⚠️  发现 ${{ steps.audit.outputs.warning_count }} 处死代码，请查看报告"
          fi
          echo "=========================================="
