# ==============================================================================
# Bingxi ERP CI/CD Pipeline - 严格化 + 全面日志版本
#
# 设计目标：
#   1. 构建验证严格化（移除所有 `|| true` 降级）
#   2. 全面的日志记录（环境、构建、测试、依赖、审计）
#   3. 失败时自动诊断（最近 commit、变更文件、错误上下文）
#
# 工作流拓扑：
#   ci-info → [ci-fmt-rust, ci-fmt-fe, ci-lint-rust, ci-lint-fe, ci-type-check,
#              ci-test-rust, ci-test-fe, ci-audit, ci-deps, ci-perf-bench,
#              ci-build-rust, ci-build-fe] → [package-release] → [github-release]
#              → [ci-cleanup-retry]（收尾：失败时清理全部缓存并自动重跑全流程）
#
# 注意：E2E 测试已独立到 .github/workflows/e2e-batch.yml（每 30 批次运行，不阻塞主 CI）
# ==============================================================================

name: CI/CD Pipeline - 严格构建验证 + 全面日志

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.monkeycode/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.monkeycode/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      skip_release:
        description: '跳过 release（用于调试）'
        required: false
        type: boolean
        default: false
      retry_count:
        description: '自动重试计数（内部使用，防止无限重试；正常手动触发保持 0）'
        required: false
        type: number
        default: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # rust-toolchain pin 到 commit SHA（供应链安全，防止 @master 被篡改）；更新时同步改全部 6 处
  RUST_VERSION: 1.94.1
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  NODE_VERSION: 22
  # npm / pnpm 严格化
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

# ------------------------------------------------------------------------------
# 公共变量：日志目录
# ------------------------------------------------------------------------------
defaults:
  run:
    shell: bash

# ==============================================================================
# Job 1: 环境信息收集（最低成本，无需编译）
# ==============================================================================
jobs:
  ci-info:
    name: 📋 环境信息
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 仅需最近 10 个 commit 用于环境信息展示（git log --oneline -5），无需完整历史
          fetch-depth: 10

      - name: 收集环境信息
        run: |
          mkdir -p reports
          {
            echo "# 环境信息报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')  "
            echo "**Runner**: ${{ runner.os }} / ${{ runner.arch }}  "
            echo "**Commit**: ${{ github.sha }}  "
            echo "**Ref**: ${{ github.ref }}  "
            echo ""
            echo "## 工具链版本"
            echo ""
            echo "| 工具 | 版本 |"
            echo "|------|------|"
            echo "| rustc | $(rustc --version 2>&1 || echo 'N/A') |"
            echo "| cargo | $(cargo --version 2>&1 || echo 'N/A') |"
            echo "| rustfmt | $(cargo fmt --version 2>&1 || echo 'N/A') |"
            echo "| clippy | $(cargo clippy --version 2>&1 || echo 'N/A') |"
            echo "| node | $(node --version 2>&1 || echo 'N/A') |"
            echo "| npm | $(npm --version 2>&1 || echo 'N/A') |"
            echo "| git | $(git --version 2>&1 || echo 'N/A') |"
            echo ""
            echo "## 系统信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 操作系统 | $(uname -a) |"
            echo "| 发行版 | $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d= -f2 | tr -d '\"' || echo 'N/A') |"
            echo "| CPU 核心 | $(nproc) |"
            echo "| 内存 | $(free -h | awk '/Mem:/ {print $2}') |"
            echo "| 磁盘可用 | $(df -h / | tail -1 | awk '{print $4}') |"
            echo ""
            echo "## 关键文件"
            echo ""
            echo "| 文件 | 状态 |"
            echo "|------|------|"
            for f in backend/Cargo.toml backend/Cargo.lock backend/.clippy.toml backend/.clippy-baseline.txt frontend/package.json frontend/package-lock.json frontend/tsconfig.json .github/workflows/ci-cd.yml; do
              if [ -f "$f" ]; then
                SIZE=$(stat -c %s "$f")
                echo "| $f | ✅ 存在（$SIZE 字节）|"
              else
                echo "| $f | ❌ 缺失 |"
              fi
            done
            echo ""
            echo "## 变更范围（最近 5 个 commit）"
            echo ""
            echo '```'
            git log --oneline -5
            echo '```'
            echo ""
            echo "## 工作树状态"
            echo ""
            echo '```'
            git status -s || echo "工作树干净"
            echo '```'
          } > reports/env-info.md

          {
            echo "{"
            echo "  \"generated_at\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\","
            echo "  \"runner\": \"${{ runner.os }}\","
            echo "  \"arch\": \"${{ runner.arch }}\","
            echo "  \"commit\": \"${{ github.sha }}\","
            echo "  \"ref\": \"${{ github.ref }}\","
            echo "  \"rustc\": \"$(rustc --version 2>&1 || echo N/A)\","
            echo "  \"cargo\": \"$(cargo --version 2>&1 || echo N/A)\","
            echo "  \"node\": \"$(node --version 2>&1 || echo N/A)\","
            echo "  \"npm\": \"$(npm --version 2>&1 || echo N/A)\","
            echo "  \"cpus\": $(nproc),"
            echo "  \"mem_total\": \"$(free -h | awk '/Mem:/ {print $2}')\","
            echo "  \"disk_free\": \"$(df -h / | tail -1 | awk '{print $4}')\""
            echo "}"
          } > reports/env-info.json

      - name: 上传环境信息
        uses: actions/upload-artifact@v4
        with:
          name: env-info
          path: reports/env-info.*
          retention-days: 90

      - name: 写入 Step Summary
        run: |
          cat reports/env-info.md >> "$GITHUB_STEP_SUMMARY"

# ==============================================================================
# Job 2: Rust 格式检查（渐进式严格化）
# ==============================================================================
  ci-fmt-rust:
    name: 🔧 Rust 格式检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-info
    # 自动修正格式后需要提交 push，故需 contents: write
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Rust（rustfmt）
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: 运行 cargo fmt 检查（失败时自动修正）
        working-directory: backend
        # 检查 + 自动修正：先 --check，若失败自动执行 cargo fmt --all 修正并提交
        # 修正后再次验证，仍失败才阻塞 CI（避免提交了未修正的代码）
        run: |
          mkdir -p reports
          set +e
          cargo fmt --all -- --check 2>&1 | tee reports/cargo-fmt-diff.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # 若检查失败：自动执行 cargo fmt --all 修正
          FIXED=0
          if [ "$EXIT_CODE" -ne "0" ]; then
            echo "❌ 格式检查失败，自动执行 cargo fmt --all 修正..."
            cargo fmt --all
            set +e
            cargo fmt --all -- --check 2>&1 | tee reports/cargo-fmt-verify.txt
            FIXED_EXIT=${PIPESTATUS[0]}
            set -e
            if [ "$FIXED_EXIT" -eq "0" ]; then
              FIXED=1
              echo "✅ 自动修正完成"
            else
              echo "❌ 自动修正后仍存在格式差异（CI 阻塞）"
            fi
          fi

          {
            echo "# Rust 格式检查报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**首次检查退出码**: $EXIT_CODE  "
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "**模式**: 严格阻塞（V15 批次 07 P1-4）"
            else
              echo "**模式**: 自动修正（失败时执行 cargo fmt --all 并提交）"
            fi
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 所有代码格式正确"
              echo ""
              echo "无需修复。"
            elif [ "$FIXED" -eq "1" ]; then
              echo "## ✅ 已自动修正（cargo fmt --all）"
              echo ""
              echo "### 修复前 Diff 内容（前 100 行）"
              echo ""
              echo '```diff'
              head -100 reports/cargo-fmt-diff.txt
              echo '```'
              echo ""
              echo "*自动修正已提交到本分支，CI 将基于修正后代码继续。*"
            else
              DIFF_LINES=$(wc -l < reports/cargo-fmt-verify.txt)
              echo "## ❌ 自动修正后仍发现 $DIFF_LINES 行格式差异（CI 阻塞）"
              echo ""
              echo "### 修正后仍存在的差异（前 100 行）"
              echo ""
              echo '```diff'
              head -100 reports/cargo-fmt-verify.txt
              echo '```'
              echo ""
              echo "请手动检查 rustfmt 配置或相关文件。"
            fi
          } > reports/cargo-fmt-report.md

          {
            echo "## Rust 格式检查"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 全部通过"
            elif [ "$FIXED" -eq "1" ]; then
              echo "✅ 已自动修正（cargo fmt --all）并提交"
            else
              echo "❌ 自动修正后仍有格式差异（CI 阻塞）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 若自动修正成功且工作树有变更，提交到当前分支
          if [ "$FIXED" -eq "1" ]; then
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A backend/
            if git diff --cached --quiet; then
              echo "ℹ️ 无格式变更可提交"
            else
              git commit -m "style(rust): cargo fmt 自动修正格式" || echo "提交失败，跳过"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git push origin HEAD:${{ github.ref_name }} || echo "推送失败，可能有冲突"
            fi
          fi

          # 首次检查失败且自动修正仍失败 → 阻塞 CI
          if [ "$EXIT_CODE" -ne "0" ] && [ "$FIXED" -eq "0" ]; then
            exit 1
          fi
          exit 0

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fmt-report
          path: |
            reports/
            backend/reports/
          retention-days: 90

# ==============================================================================
# Job 3: 前端格式检查
# ==============================================================================
  ci-fmt-fe:
    name: 🔧 前端格式检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-info
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 运行 prettier 检查（严格阻塞）
        working-directory: frontend
        # V15 批次 07 P1-5：fmt 失败阻塞 CI（移除渐进式 exit 0）
        # 修复方法：cd frontend && npm run format
        run: |
          mkdir -p reports
          set +e
          npx prettier --check 'src/**/*.{vue,ts,tsx,js,jsx,css,scss,json,md}' 2>&1 | tee reports/prettier-check.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          {
            echo "# 前端格式检查报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**退出码**: $EXIT_CODE  "
            echo "**模式**: 严格阻塞（V15 批次 07 P1-5）"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 所有代码格式正确"
            else
              echo "## ❌ 发现格式问题（CI 阻塞）"
              echo ""
              echo "### 自动修复命令"
              echo ""
              echo '```bash'
              echo "cd frontend"
              echo "npm run format"
              echo '```'
              echo ""
              echo "### 报告内容"
              echo ""
              echo '```'
              cat reports/prettier-check.txt
              echo '```'
            fi
          } > reports/prettier-report.md

          {
            echo "## 前端格式检查"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 全部通过"
            else
              echo "❌ 发现格式问题（V15 批次 07 P1-5 修复：严格阻塞 CI）"
              echo ""
              echo "修复命令：\`cd frontend && npm run format\`"
              echo ""
              echo "提交格式修复后 CI 将通过。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # V15 批次 07 P1-5 修复：fmt 失败阻塞 CI（移除渐进式 exit 0）
          # 修复方法：cd frontend && npm run format
          exit $EXIT_CODE

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-fmt-report
          path: reports/
          retention-days: 90

# ==============================================================================
# Job 4: Rust Clippy 检查（V15 Batch 485 baseline 机制 - clippy 专用）
# ==============================================================================
# V15 Batch 485 修订（第 6 轮 CI 后）：
# - P0-T03 原方案"clippy 零容忍"（CURRENT_COUNT > 0 阻塞）在默认 features 下
#   暴露 1781 个预存 dead_code 警告（常量/关联函数未使用），无法在一个批次中清零。
# - 经评估：这些是技术债务，非阻塞 bug；ci-test-rust 零容忍已落实（编译错误必阻塞）。
# - 决策：恢复 clippy baseline 机制（仅 clippy），test 保持零容忍。
# - baseline 机制：首次跑自动建立基线，后续 PR 仅"新增警告"阻塞 CI。
# - 自动刷新：main 分支 + strict 模式 + 已修复警告 > 0 + 无新警告 → 刷新 baseline。
# - audit-report batch-06 §6.2 缺陷项 2 的根因（test baseline 掩盖编译失败）
#   已由 P0-06-6（修复 bi_analysis_test.rs）+ test 零容忍解决，与 clippy baseline 无关。
  ci-lint-rust:
    name: 🔍 Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ci-info
    # 启用 contents: write 以便"提交 baseline 文件"步骤能 push 自动建立的基线
    # baseline 机制：首次跑自动建立基线，后续 PR 仅"新增警告"阻塞 CI
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust（clippy + 系统依赖）
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          system-deps: pkg-config libssl-dev protobuf-compiler

      - name: 运行 clippy（baseline 机制）
        working-directory: backend
        # baseline 机制：仅 clippy 使用，test 保持零容忍；仅"新增警告"阻塞 CI
        # exit 143 = SIGTERM（OOM/超时）：限制并行编译降内存峰值 + 3 次重试
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_JOBS: "1"
        run: |
          mkdir -p reports
          set +e

          # ============================================================================
          # 阶段 1：主 clippy 运行（JSON 格式，带 retry）
          # ============================================================================
          # 不加 -- -D warnings（避免 JSON 截断），由 NEW_COUNT > 0 判定阻塞
          # 不加 --all-features（与 build/test 一致用默认 features；--all-features 产生 1773 个误报）
          echo "▶ 阶段 1/3：主 clippy 运行（JSON 输出，带 retry）"
          CLIPPY_MAIN_EXIT=143
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "  尝试 $ATTEMPT/$MAX_ATTEMPTS..."
            cargo clippy --all-targets --message-format=json \
              --color=always 2>reports/clippy-stderr.txt \
              | tee reports/clippy-output.json > /dev/null
            CLIPPY_MAIN_EXIT=${PIPESTATUS[0]}
            echo "  主 clippy 退出码: $CLIPPY_MAIN_EXIT"
            # 0 = 成功；101 = 编译错误（真正的代码问题，不重试）；其他（143/137/1）= 基础设施问题，重试
            if [ "$CLIPPY_MAIN_EXIT" -eq "0" ] || [ "$CLIPPY_MAIN_EXIT" -eq "101" ]; then
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "  ⚠️  clippy 异常退出（exit $CLIPPY_MAIN_EXIT，疑似基础设施问题），$((ATTEMPT * 10))s 后重试..."
              sleep $((ATTEMPT * 10))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          # 合并 stderr 中可能的警告
          cat reports/clippy-stderr.txt >> reports/clippy-output.json 2>/dev/null || true

          # ============================================================================
          # 阶段 2：人类可读详细输出（基于 JSON rendered 字段重渲染）+ 短格式定位日志
          # ============================================================================
          echo "▶ 阶段 2/3：生成人类可读详细日志 + 短格式定位日志"
          # 用 jq 从 JSON 提取每条 message 的 rendered 字段，生成完整人类可读报告
          # 包含每条警告的完整渲染信息（代码片段、行号、原因说明）
          # 2026-07-31 优化：合并原 clippy-human-readable.txt（中间文件）与 -full.txt（带 header），
          # 消除冗余，artifact 中只保留 clippy-human-readable-full.txt
          # 2026-08-03 新增：clippy-log.txt 短格式日志（file:line:col: level: message [lint]），
          # 便于快速定位错误，失败时在 CI 输出中直接打印
          TMP_RENDERED=$(mktemp)
          jq -r 'select(.reason == "compiler-message") |
                 .message |
                 select(.level == "warning" or .level == "error") |
                 .rendered' reports/clippy-output.json 2>/dev/null > "$TMP_RENDERED"
          RENDERED_LINES=$(wc -l < "$TMP_RENDERED")
          {
            echo "# Clippy 人类可读详细输出（从 JSON rendered 重渲染）"
            echo ""
            echo "生成时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "命令: cargo clippy --all-targets --message-format=json（默认 features）"
            echo "工具链: $(rustc --version)"
            echo "clippy 版本: $(cargo clippy --version)"
            echo ""
            echo "=========================================="
            echo ""
            cat "$TMP_RENDERED"
            echo ""
            echo "=========================================="
            echo "总计渲染 $RENDERED_LINES 行"
          } > reports/clippy-human-readable-full.txt
          rm -f "$TMP_RENDERED"

          # 短格式定位日志：file:line:col: level: message [lint]
          # 每行一条，便于 grep/文本编辑器直接跳转定位
          jq -r 'select(.reason == "compiler-message") |
                 .message |
                 select(.level == "warning" or .level == "error") |
                 "\(.spans[0].file_name // "?"):\(.spans[0].line_start // "?"):\(.spans[0].column_start // "?"): \(.level): \(.message) [\(.code.code // "?")]"' \
            reports/clippy-output.json 2>/dev/null > reports/clippy-log.txt
          CLIPPY_LOG_LINES=$(wc -l < reports/clippy-log.txt)
          echo "短格式日志行数: $CLIPPY_LOG_LINES（reports/clippy-log.txt）"

          # ============================================================================
          # 阶段 3：解析 JSON，按多维度统计（lint_id / file / line）
          # ============================================================================
          # 注：原 RUSTC_LOG=debug 重复 clippy 运行已删除（曾导致 CI 超时 55min）
          echo "▶ 阶段 3/3：多维度统计"

          # 原始警告摘要（用于 baseline 对比 + CURRENT_COUNT 统计）
          cat reports/clippy-output.json | \
            jq -r 'select(.reason == "compiler-message") |
                   .message |
                   select(.level == "warning" or .level == "error") |
                   .rendered' 2>/dev/null | \
            sort -u > reports/clippy-current.txt
          CURRENT_COUNT=$(wc -l < reports/clippy-current.txt)
          echo "当前 clippy 警告/错误数: $CURRENT_COUNT"

          # 4.2 提取结构化数据：每条警告的 lint_id / file / line / column / message
          # 输出 TSV 格式：lint_id \t file \t line \t column \t message
          jq -r 'select(.reason == "compiler-message") |
                 .message |
                 select(.level == "warning" or .level == "error") |
                 {
                   lint_id: (.code.code // "unknown"),
                   file: (.spans[0].file_name // "N/A"),
                   line: (.spans[0].line_start // 0),
                   column: (.spans[0].column_start // 0),
                   level: .level,
                   message: .message
                 } | [.lint_id, .file, (.line|tostring), (.column|tostring), .level, .message] | @tsv' \
            reports/clippy-output.json 2>/dev/null > reports/clippy-structured.tsv
          STRUCTURED_COUNT=$(wc -l < reports/clippy-structured.tsv)
          echo "结构化警告记录数: $STRUCTURED_COUNT"

          # 4.3 按 lint_id 分组统计
          {
            echo "# Clippy 警告按 lint 类型分布"
            echo ""
            echo "生成时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "| Lint ID | 数量 |"
            echo "|---------|------|"
            awk -F'\t' '{count[$1]++} END {for (k in count) printf "| `%s` | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv | sort -t'|' -k3 -rn
          } > reports/clippy-by-lint-id.md

          # 4.4 按 file 分组统计
          {
            echo "# Clippy 警告按文件分布"
            echo ""
            echo "生成时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "| 文件 | 数量 |"
            echo "|------|------|"
            awk -F'\t' '{count[$2]++} END {for (k in count) printf "| `%s` | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv | sort -t'|' -k3 -rn
          } > reports/clippy-by-file.md

          # 4.5 按严重程度分组
          {
            echo "# Clippy 警告按严重程度分布"
            echo ""
            echo "生成时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "| 严重程度 | 数量 |"
            echo "|----------|------|"
            awk -F'\t' '{count[$5]++} END {for (k in count) printf "| %s | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv | sort
          } > reports/clippy-by-severity.md

          # 4.6 生成完整 JSON 摘要（机器可读）
          jq -r 'select(.reason == "compiler-message") |
                 .message |
                 select(.level == "warning" or .level == "error") |
                 {
                   lint_id: (.code.code // "unknown"),
                   file: (.spans[0].file_name // "N/A"),
                   line: (.spans[0].line_start // 0),
                   column: (.spans[0].column_start // 0),
                   level: .level,
                   message: .message,
                   rendered: .rendered
                 }' reports/clippy-output.json 2>/dev/null \
            > reports/clippy-warnings.json

          # 5. V15 Batch 485 修订：恢复 baseline 机制（仅 clippy，test 保持零容忍）
          # 原因：默认 features 下有 1781 个预存 dead_code 警告，无法在一个批次中清零。
          # baseline 机制：首次跑自动建立基线，后续 PR 仅"新增警告"阻塞 CI（NEW_COUNT > 0）。
          NEW_COUNT=0
          BASELINE_COUNT=0
          FIXED_COUNT=0
          BASELINE_MODE=""

          if [ ! -f ".clippy-baseline.txt" ]; then
            # 首次跑：自动建立 baseline，不阻塞
            BASELINE_MODE="bootstrap"
            echo "⚠️  未找到 backend/.clippy-baseline.txt"
            echo "📝 自动建立基线（首次跑，渐进式，不阻塞）"

            # 把当前警告列表作为 baseline
            cp reports/clippy-current.txt .clippy-baseline.txt
            BASELINE_COUNT=$CURRENT_COUNT
            NEW_COUNT=0
            FIXED_COUNT=0
            echo "✅ 基线已自动建立：$BASELINE_COUNT 条警告"
            echo "💡 后续 PR 将严格化：新警告 = 失败"
            echo "💡 提交 backend/.clippy-baseline.txt 到 git"
          else
            BASELINE_MODE="strict"
            BASELINE_COUNT=$(wc -l < .clippy-baseline.txt)
            echo "基线警告数: $BASELINE_COUNT"

            # 只比较警告摘要行（warning:/error: 开头），忽略代码片段行
            # 代码片段含行号与代码内容，任何行号偏移都会导致虚假"新警告"。
            grep -E '^(warning|error):' reports/clippy-current.txt | sort -u > reports/clippy-current-summary.txt
            grep -E '^(warning|error):' .clippy-baseline.txt | sort -u > reports/clippy-baseline-summary.txt
            comm -23 reports/clippy-current-summary.txt reports/clippy-baseline-summary.txt > reports/clippy-new.txt
            NEW_COUNT=$(wc -l < reports/clippy-new.txt)
            echo "新增警告数: $NEW_COUNT"

            # 找出已修复警告（基线有但当前没有）
            comm -13 reports/clippy-current-summary.txt reports/clippy-baseline-summary.txt > reports/clippy-fixed.txt
            FIXED_COUNT=$(wc -l < reports/clippy-fixed.txt)
            echo "已修复警告数: $FIXED_COUNT"
          fi

          # 6. 生成 Markdown 报告
          {
            echo "# Rust Clippy 检查报告（超详细版）"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**模式**: $BASELINE_MODE  "
            echo "**当前警告总数**: $CURRENT_COUNT  "
            echo "**结构化记录数**: $STRUCTURED_COUNT  "
            echo "**基线警告数**: $BASELINE_COUNT  "
            echo "**新增警告数**: $NEW_COUNT  "
            echo "**已修复警告数**: $FIXED_COUNT  "
            echo "**工具链**: $(rustc --version)  "
            echo "**clippy 版本**: $(cargo clippy --version 2>&1 | head -1)  "
            echo ""
            echo "## 📊 多维度统计"
            echo ""
            echo "### 按 lint 类型分布（TOP 20）"
            echo ""
            echo "| Lint ID | 数量 |"
            echo "|---------|------|"
            awk -F'\t' '{count[$1]++} END {for (k in count) printf "| \`%s\` | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv 2>/dev/null | sort -t'|' -k3 -rn | head -20
            echo ""
            echo "### 按文件分布（TOP 20）"
            echo ""
            echo "| 文件 | 数量 |"
            echo "|------|------|"
            awk -F'\t' '{count[$2]++} END {for (k in count) printf "| \`%s\` | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv 2>/dev/null | sort -t'|' -k3 -rn | head -20
            echo ""
            echo "### 按严重程度分布"
            echo ""
            echo "| 严重程度 | 数量 |"
            echo "|----------|------|"
            awk -F'\t' '{count[$5]++} END {for (k in count) printf "| %s | %s |\n", k, count[k]}' \
              reports/clippy-structured.tsv 2>/dev/null | sort
            echo ""
            echo "> 注：完整统计见 \`clippy-by-lint-id.md\` / \`clippy-by-file.md\` / \`clippy-by-severity.md\`（上方为 TOP20 摘要）"
            echo "## 📁 详细日志归档（artifacts: \`backend-clippy-report\`）"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|------|------|"
            echo "| \`clippy-output.json\` | 原始 JSON 输出（机器可读，最完整） |"
            echo "| \`clippy-log.txt\` | 短格式定位日志（file:line:col，每行一条，快速定位） |"
            echo "| \`clippy-human-readable-full.txt\` | 人类可读详细日志（含代码片段、行号） |"
            echo "| \`clippy-stderr.txt\` | clippy stderr 输出 |"
            echo "| \`clippy-structured.tsv\` | 结构化 TSV（lint_id\\tfile\\tline\\tcol\\tlevel\\tmsg） |"
            echo "| \`clippy-warnings.json\` | 仅警告的结构化 JSON |"
            echo "| \`clippy-by-lint-id.md\` | 按 lint 类型完整统计 |"
            echo "| \`clippy-by-file.md\` | 按文件完整统计 |"
            echo "| \`clippy-by-severity.md\` | 按严重程度完整统计 |"
            echo "| \`clippy-explain.txt\` | 新增警告的 \`--explain\` 解释 |"
            echo ""
            if [ "$BASELINE_MODE" = "bootstrap" ]; then
              echo "## 🎯 首次运行（自动建立基线）"
              echo ""
              echo "本项目此前未配置 clippy baseline，已自动将当前 $BASELINE_COUNT 条警告作为基线。"
              echo ""
              echo "### 后续策略"
              echo ""
              echo "- **新警告 = 0 容忍**（CI 失败）"
              echo "- **历史警告 = 渐进清理**（基线大小 = 剩余债务）"
              echo ""
              echo "### 下一步"
              echo ""
              echo "1. 检查 \`backend/.clippy-baseline.txt\` 内容"
              echo "2. 提交 baseline 文件到 git（CI 会自动提交）"
              echo "3. 后续 PR 严格化"
              echo ""
              echo "### 历史警告 TOP 10"
              echo ""
              if [ "$CURRENT_COUNT" -gt "0" ]; then
                echo "| 文件 | 警告数 |"
                echo "|------|--------|"
                grep -oE 'src/[^:]+\.rs' reports/clippy-current.txt | sort | uniq -c | sort -rn | head -10 | \
                  awk '{printf "| \`backend/%s\` | %s |\n", $2, $1}'
              else
                echo "_（无警告）_"
              fi
            elif [ "$NEW_COUNT" -eq "0" ]; then
              echo "## ✅ 无新增警告"
              if [ "$FIXED_COUNT" -gt "0" ]; then
                echo ""
                echo "🎉 本次运行修复了 $FIXED_COUNT 个历史警告，CI 会自动刷新基线。"
              fi
            else
              echo "## ❌ 新增 $NEW_COUNT 个警告（新代码质量不达标）"
              echo ""
              echo "### 新增警告列表（前 30）"
              echo ""
              echo '```'
              head -30 reports/clippy-new.txt
              echo '```'
              echo ""
              echo "### 修复命令"
              echo ""
              echo "对每条警告："
              echo "1. 阅读警告信息（包含文件路径、行号、原因）"
              echo "2. 修复代码"
              echo "3. 重新跑 \`cargo clippy --all-targets\` 验证"
              echo ""
              echo "如确认是误报，可加 \`#[allow(clippy::lint_name)]\` 抑制（需符合规则 14）。"
            fi
            echo ""
            echo "## 基线文件"
            echo ""
            echo "- \`backend/.clippy-baseline.txt\`（$BASELINE_COUNT 条）"
            if [ -f "backend/.clippy-baseline.txt" ]; then
              echo "- 当前大小: $(du -h backend/.clippy-baseline.txt | cut -f1)"
            fi
            echo ""
            if [ -s reports/clippy-fixed.txt ] && [ "$BASELINE_MODE" = "strict" ]; then
              echo "## 已修复警告（建议从基线移除）"
              echo ""
              echo '```'
              head -30 reports/clippy-fixed.txt
              echo '```'
            fi
          } > reports/clippy-report.md

          # 7. 为新增警告生成 --explain 解释（帮助理解 lint 触发原因）
          echo "▶ 生成新增警告的 --explain 解释"
          {
            echo "# Clippy 新增警告 --explain 解释"
            echo ""
            echo "生成时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            if [ ! -s reports/clippy-new.txt ]; then
              echo "_（无新增警告）_"
            else
              # 提取新警告中涉及到的 lint code（如 clippy::needless_collect）
              LINT_CODES=$(awk -F'\t' '{print $1}' reports/clippy-structured.tsv | \
                grep -E '^clippy::' | sort -u)
              if [ -n "$LINT_CODES" ]; then
                for code in $LINT_CODES; do
                  echo "## \`$code\`"
                  echo ""
                  echo '```'
                  rustc --explain "$code" 2>&1 | head -50 || echo "（无解释）"
                  echo '```'
                  echo ""
                done
              else
                echo "_（未提取到 clippy:: 前缀的 lint code）_"
              fi
            fi
          } > reports/clippy-explain.txt

          # 8. 决定退出码（baseline 机制：仅新增警告阻塞 CI）
          # D08-1 教训：clippy 编译失败（退出码 101）时 current.txt 不完整，
          # 误触发自动刷新把 baseline 缩小。修复：记录 CLIPPY_MAIN_EXIT，自动刷新需 clippy 正常退出。
          echo "CLIPPY_MAIN_EXIT=$CLIPPY_MAIN_EXIT" > reports/clippy-main-exit.txt

          if [ "$CLIPPY_MAIN_EXIT" -ne "0" ]; then
            echo ""
            echo "❌ clippy 主命令退出码为 $CLIPPY_MAIN_EXIT，存在编译错误或基础设施异常，CI 失败"
            echo ""
            echo "=== clippy 短格式错误日志（file:line:col 定位）==="
            cat reports/clippy-log.txt 2>/dev/null || true
            echo "=== clippy stderr（前 120 行）==="
            sed -n '1,120p' reports/clippy-stderr.txt 2>/dev/null || true
            echo "=== clippy 错误摘要 ==="
            grep -E '^error:' reports/clippy-current.txt 2>/dev/null || true
            echo "详见 reports/clippy-report.md 和 artifacts"
            exit 1
          fi

          if [ "$NEW_COUNT" -gt "0" ]; then
            echo ""
            echo "❌ 发现 $NEW_COUNT 个新警告，CI 失败"
            echo ""
            echo "=== 新增警告短格式日志（file:line:col 定位）==="
            # clippy-new.txt 为摘要行（warning: message），clippy-log.txt 为 file:line:col: warning: message [lint]
            # 用 message 关键字在 clippy-log.txt 中匹配对应行，实现精确定位
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              msg=$(echo "$line" | sed 's/^\(warning\|error\): //')
              [ -n "$msg" ] && grep -F "$msg" reports/clippy-log.txt
            done < reports/clippy-new.txt | sort -u
            echo "=== 新增警告列表（完整）==="
            cat reports/clippy-new.txt
            echo "=== 列表结束 ==="
            echo "详见 reports/clippy-report.md 和 artifacts"
            exit 1
          fi

          # 写入环境变量供后续步骤使用（自动刷新 baseline）
          echo "CLIPPY_BASELINE_MODE=$BASELINE_MODE" >> "$GITHUB_ENV"
          echo "CLIPPY_NEW_COUNT=$NEW_COUNT" >> "$GITHUB_ENV"
          echo "CLIPPY_FIXED_COUNT=$FIXED_COUNT" >> "$GITHUB_ENV"
          echo "CLIPPY_CURRENT_COUNT=$CURRENT_COUNT" >> "$GITHUB_ENV"
          echo "CLIPPY_BASELINE_COUNT=$BASELINE_COUNT" >> "$GITHUB_ENV"
          echo "CLIPPY_MAIN_EXIT=$CLIPPY_MAIN_EXIT" >> "$GITHUB_ENV"

          echo "✅ 无新增 clippy 警告"
          exit 0

      - name: 评估 clippy 严格模式就绪度（复用主步骤 TSV，不重跑 clippy）
        # 信息性 job：不阻塞 CI（continue-on-error: true）
        # 目的：监控 baseline 缩减进度，当 baseline = 0 时自动切换主 clippy 步骤为严格模式
        # 2026-07-31 优化：原步骤重跑 `cargo clippy -- -D warnings`（约 60-120s）仅为统计 error 数，
        # 现复用主步骤已生成的 clippy-structured.tsv：-D warnings 会把所有 warning 升为 error，
        # 故严格模式 error 数 = TSV 中 level=warning 的行数。
        # 2026-08-02 修复：移除 working-directory: backend，TSV 文件在主步骤根目录生成；
        # 使用 ../reports/ 路径确保能正确找到主步骤产物，避免 OOM runner 因文件缺失长时间等待。
        if: always()
        continue-on-error: true
        env:
          # 主步骤在根目录生成 reports/，本步骤需从根目录读取
          TSV_PATH: backend/reports/clippy-structured.tsv
          BASELINE_PATH: backend/.clippy-baseline.txt
        run: |
          REPORT_DIR="reports"
          mkdir -p "$REPORT_DIR"

          # 从主步骤生成的 clippy-structured.tsv 统计 warning 数（等价于严格模式 error 数）
          # TSV 格式：lint_id \t file \t line \t column \t level \t message
          if [ -f "$TSV_PATH" ]; then
            STRICT_ERRORS=$(awk -F'\t' '$5 == "warning" {c++} END {print c+0}' "$TSV_PATH" 2>/dev/null || echo "0")
          else
            echo "⚠️ clippy-structured.tsv 不存在（路径: $TSV_PATH），无法评估就绪度"
            STRICT_ERRORS="unknown"
          fi
          echo "严格模式下预估 error 数（=当前 warning 数）: $STRICT_ERRORS"

          # 就绪度判定（等价于原逻辑：warning 数 = 0 即就绪）
          STRICT_READINESS="未就绪"
          if [ "$STRICT_ERRORS" = "0" ]; then
            STRICT_READINESS="✅ 已就绪：可将主 clippy 步骤切换为 -D warnings 严格模式"
          elif [ "$STRICT_ERRORS" != "unknown" ] && [ "$STRICT_ERRORS" -lt "50" ]; then
            STRICT_READINESS="⚠️ 接近就绪（剩余 $STRICT_ERRORS 个 error < 50）"
          else
            STRICT_READINESS="❌ 未就绪（剩余 $STRICT_ERRORS 个 error，需逐步清理）"
          fi

          # 生成严格模式就绪度报告
          {
            echo "# Clippy 严格模式就绪度报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**严格模式预估 error 数**: $STRICT_ERRORS（= 当前 warning 数，复用 TSV 统计）  "
            echo "**就绪状态**: $STRICT_READINESS  "
            echo ""
            echo "## 切换路径"
            echo ""
            echo "- 当前：baseline 机制（仅新增警告阻塞 CI）"
            echo "- 目标：\`cargo clippy --all-targets -- -D warnings\`（所有警告阻塞 CI）"
            echo "- 切换条件：baseline 警告数 < 50 且严格模式 error 数 < 50"
            echo ""
            echo "## 当前 baseline 状态"
            echo ""
            if [ -f "$BASELINE_PATH" ]; then
              BASELINE_LINES=$(wc -l < "$BASELINE_PATH")
              echo "- baseline 文件：\`$BASELINE_PATH\`"
              echo "- baseline 行数：$BASELINE_LINES"
            else
              echo "- baseline 文件：未建立"
            fi
            echo ""
            if [ "$STRICT_ERRORS" != "unknown" ] && [ "$STRICT_ERRORS" -gt "0" ]; then
              echo "## 严格模式失败详情（前 30 条，按 lint 类型分布）"
              echo ""
              echo "| Lint ID | 数量 |"
              echo "|---------|------|"
              awk -F'\t' '$5 == "warning" {count[$1]++} END {for (k in count) printf "| \`%s\` | %s |\n", k, count[k]}' \
                "$TSV_PATH" 2>/dev/null | sort -t'|' -k3 -rn | head -30
            fi
          } > "$REPORT_DIR/clippy-strict-report.md"

          # 写入 Step Summary
          {
            echo "## 🔍 Clippy 严格模式（-D warnings）就绪度"
            echo ""
            echo "- 状态：$STRICT_READINESS"
            echo "- 严格模式预估 error 数：$STRICT_ERRORS（复用主步骤 TSV，未重跑 clippy）"
            echo "- 详细报告：artifacts \`backend-clippy-report/clippy-strict-report.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # 写入环境变量供后续步骤使用
          echo "CLIPPY_STRICT_ERRORS=$STRICT_ERRORS" >> "$GITHUB_ENV" || true
          echo "CLIPPY_STRICT_READINESS=$STRICT_READINESS" >> "$GITHUB_ENV" || true

          # 信息性检查，永远 exit 0（不阻塞 CI）
          exit 0

      - name: 提交 baseline 文件（首次运行时）+ 自动重建 baseline（main 分支每次 CI 后）
        if: always()
        run: |
          if [ -f "backend/.clippy-baseline.txt" ] || [ -f ".clippy-baseline.txt" ]; then
            BASELINE_PATH=".clippy-baseline.txt"
            if [ -f "backend/.clippy-baseline.txt" ]; then
              BASELINE_PATH="backend/.clippy-baseline.txt"
            fi
            # 从文件读取 clippy 主退出码（NEW_COUNT > 0 时 step 提前 exit 1，$GITHUB_ENV 未写入）
            CLIPPY_MAIN_EXIT_VAL="unknown"
            if [ -f "backend/reports/clippy-main-exit.txt" ]; then
              CLIPPY_MAIN_EXIT_VAL=$(grep -E '^CLIPPY_MAIN_EXIT=' backend/reports/clippy-main-exit.txt | cut -d= -f2)
            elif [ -f "reports/clippy-main-exit.txt" ]; then
              CLIPPY_MAIN_EXIT_VAL=$(grep -E '^CLIPPY_MAIN_EXIT=' reports/clippy-main-exit.txt | cut -d= -f2)
            fi
            echo "CLIPPY_MAIN_EXIT_VAL=$CLIPPY_MAIN_EXIT_VAL"
            if git ls-files --error-unmatch "$BASELINE_PATH" 2>/dev/null; then
              echo "✅ baseline 文件已纳入版本控制"
              # main 分支自动重建 baseline（每次 CI 后用当前真实警告完全替换 baseline）
              # 2026-07-30 修订：原机制仅在 FIXED_COUNT > 0 时刷新，导致 baseline 57% 抽样过时
              # （如 ALIPAY/BudgetMode/CustomerNotFound 等已实际使用但 baseline 仍标记为 dead_code）。
              # 新机制：main 分支每次 CI 后，只要 clippy 正常退出（CLIPPY_MAIN_EXIT=0），
              # 无论 FIXED_COUNT 是否 > 0，都用当前真实警告完全重建 baseline。
              # 这样 baseline 永远反映 main 最新真实状态，过时项在下次 main CI 时自动清除。
              # PR 分支保留 NEW_COUNT > 0 阻塞机制（在主 clippy step 中处理）。
              # Batch 488 D08-1 教训保留：clippy 编译失败（退出码 101）时不重建 baseline，
              # 避免用不完整的 current 替换 baseline 导致下次 CI 误报新警告。
              if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$CLIPPY_BASELINE_MODE" = "strict" ] && [ "$CLIPPY_MAIN_EXIT_VAL" = "0" ]; then
                echo "📝 自动重建 baseline：用当前真实警告完全替换（$CLIPPY_BASELINE_COUNT → $CLIPPY_CURRENT_COUNT，已修复 $CLIPPY_FIXED_COUNT 条，新增 $CLIPPY_NEW_COUNT 条）"
                cd backend
                cp reports/clippy-current.txt .clippy-baseline.txt
                cd ..
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add "$BASELINE_PATH"
                # 仅当 baseline 文件有变化时才提交，避免空提交
                if git diff --cached --quiet "$BASELINE_PATH"; then
                  echo "ℹ️ baseline 无变化，跳过提交"
                else
                  git commit -m "chore(ci): 自动重建 clippy baseline（main CI 后真实状态同步：$CLIPPY_BASELINE_COUNT → $CLIPPY_CURRENT_COUNT，已修复 $CLIPPY_FIXED_COUNT 条）" || echo "提交失败，跳过"
                  git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
                  git push origin HEAD:${{ github.ref_name }} || echo "推送失败，可能有冲突"
                fi
              else
                echo "ℹ️ 不满足自动重建条件（非 main 分支/非 strict 模式/clippy 异常退出），跳过"
              fi
            else
              echo "📝 提交 baseline 文件: $BASELINE_PATH"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "$BASELINE_PATH"
              git commit -m "chore(ci): 自动建立 clippy 基线" || echo "提交失败，跳过"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git push origin HEAD:${{ github.ref_name }} || echo "推送失败，可能有冲突"
            fi
          fi

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-clippy-report
          path: |
            reports/
            backend/reports/
          retention-days: 90

      - name: 写入 Step Summary
        if: always()
        run: |
          if [ -f backend/reports/clippy-report.md ]; then
            cat backend/reports/clippy-report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f reports/clippy-report.md ]; then
            cat reports/clippy-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

# ==============================================================================
# Job 5: 前端 ESLint
# ==============================================================================
  ci-lint-fe:
    name: 🔍 前端 ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-info
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 运行 ESLint（单次扫描：JSON 报告 + 日志）
        working-directory: frontend
        # 2026-08-03 优化：原实现先跑一次文本扫描（reports/eslint-output.txt）再跑一次 JSON 扫描
        # （reports/eslint-report.json），同一批文件被 eslint 扫描两次，浪费时间。
        # 现合并为单次扫描：一次 eslint --format json 同时产出 JSON 报告 + 由 tee 保存完整输出，
        # 人类可读日志由 JSON 生成（eslint-log.txt），消除重复检查。
        run: |
          mkdir -p reports
          set +e
          npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --format json 2>&1 \
            | tee reports/eslint-output.json
          ESLINT_EXIT=${PIPESTATUS[0]}
          set -e

          # 由 JSON 生成人类可读日志（file:line:col: message [ruleId]），便于定位错误
          jq -r '.[] | .messages[]? | "\(.filePath):\(.line):\(.column): \(.severity == 2 ? "error" : "warning"): \(.message) [\(.ruleId // "N/A")]"' \
            reports/eslint-output.json 2>/dev/null > reports/eslint-log.txt

          # 报告生成阶段关闭 pipefail，防止 sort|head 管道因 broken pipe
          # (head 提前关闭管道) 导致 SIGPIPE 退出码 2 中断整个 CI 步骤。
          # 历史缺陷：CI #1417 因 race 触发 sort: write failed: Broken pipe，
          # 在到达 exit 0（渐进式不阻塞）之前退出。
          set +o pipefail

          # 统计错误数
          TOTAL_ERRORS=0
          if [ -f reports/eslint-output.json ]; then
            TOTAL_ERRORS=$(jq '[.[] | .errorCount] | add // 0' reports/eslint-output.json 2>/dev/null || echo 0)
          fi
          TOTAL_FILES=$(jq 'length' reports/eslint-output.json 2>/dev/null || echo 0)

          {
            echo "# 前端 ESLint 检查报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**退出码**: $ESLint_EXIT  "
            echo "**错误文件数**: $TOTAL_FILES  "
            echo "**总错误数**: $TOTAL_ERRORS  "
            echo "**模式**: V15 批次 07 P1-6 修复：严格阻塞 CI（ESLint error 必须修复）"
            echo ""
            if [ "$TOTAL_ERRORS" -eq "0" ]; then
              echo "## ✅ 无 ESLint 错误"
            else
              echo "## ❌ 发现 $TOTAL_ERRORS 个错误（$TOTAL_FILES 个文件）"
              echo ""
              echo "### 错误类型分布"
              echo ""
              if [ -f reports/eslint-output.json ]; then
                jq -r '.[] | .messages[]? | "\(.ruleId // "N/A")"' reports/eslint-output.json 2>/dev/null | sort | uniq -c | sort -rn | head -20 | \
                  awk '{printf "| `%s` | %s |\n", $2, $1}'
              fi
              echo ""
              echo "### 受影响文件 TOP 20"
              echo ""
              if [ -f reports/eslint-output.json ]; then
                jq -r '.[] | select(.errorCount > 0) | "\(.filePath):\(.errorCount)"' reports/eslint-output.json 2>/dev/null | sort -t: -k2 -rn | head -20 | \
                  awk -F: '{printf "| `%s` | %s |\n", $1, $2}'
              fi
              echo ""
              echo "### 错误定位日志（前 50 条，file:line:col）"
              echo ""
              echo '```'
              grep ': error:' reports/eslint-log.txt 2>/dev/null | head -50 || true
              echo '```'
              echo ""
              echo "### 自动修复"
              echo ""
              echo '```bash'
              echo "cd frontend"
              echo "npm run format        # 修复 prettier 问题"
              echo "npm run lint -- --fix # 修复可自动修复的问题"
              echo '```'
              echo ""
              echo "### 严格阻塞说明"
              echo ""
              echo "V15 批次 07 P1-6 修复后，ESLint error 阻塞 CI。"
              echo "请运行上述修复命令，提交修复后 CI 将通过。"
            fi
          } > reports/eslint-report.md

          {
            echo "## 前端 ESLint"
            echo ""
            if [ "$TOTAL_ERRORS" -eq "0" ]; then
              echo "✅ 无错误"
            else
              echo "❌ $TOTAL_ERRORS 个错误（V15 批次 07 P1-6 修复：严格阻塞 CI）"
              echo ""
              echo "修复命令：\`cd frontend && npm run format && npm run lint -- --fix\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # V15 批次 07 P1-6 修复：ESLint error 阻塞 CI（移除渐进式 exit 0）
          # 修复方法：cd frontend && npm run format && npm run lint -- --fix
          # 注意：仅 error 阻塞，warning 不阻塞（eslint 默认 warning 返回 exit 1）
          if [ "$TOTAL_ERRORS" -gt 0 ]; then
            exit 1
          fi
          exit 0

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: |
            reports/
            frontend/reports/
          retention-days: 90

# ==============================================================================
# Job 6: 前端类型检查
# ==============================================================================
  ci-type-check:
    name: 🔬 前端类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-info
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 运行 vue-tsc
        working-directory: frontend
        run: |
          mkdir -p reports
          set +e
          npx vue-tsc --noEmit 2>&1 | tee reports/vue-tsc-output.txt
          EXIT_CODE=$?
          set -e

          {
            echo "# 前端 TypeScript 类型检查报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**退出码**: $EXIT_CODE  "
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 无类型错误"
            else
              ERROR_COUNT=$(awk '/error TS/{c++} END{print c+0}' reports/vue-tsc-output.txt 2>/dev/null)
              echo "## ❌ 发现 $ERROR_COUNT 个类型错误"
              echo ""
              echo "### 错误列表（前 50）"
              echo ""
              echo '```'
              grep -E "error TS" reports/vue-tsc-output.txt | head -50
              echo '```'
            fi
          } > reports/type-check-report.md

          {
            echo "## 前端 TypeScript"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 通过"
            else
              ERROR_COUNT=$(awk '/error TS/{c++} END{print c+0}' reports/vue-tsc-output.txt 2>/dev/null)
              echo "❌ $ERROR_COUNT 个类型错误"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-type-check-report
          path: reports/
          retention-days: 90

# ==============================================================================
# Job 7: Rust 单元测试（V15 Batch 485 零容忍模式）
# ==============================================================================
  ci-test-rust:
    name: 🧪 Rust 测试 + 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci-info
    # 零容忍模式：任何测试失败都阻塞 CI；覆盖率信息性收集，不阻塞
    # 集成测试依赖 PostgreSQL，使用 service container 提供数据库实例
    # 2026-07-31 优化：合并原 ci-test-rust + ci-coverage-rust，用 cargo llvm-cov nextest
    # 一次执行同时产出测试断言（退出码）+ 覆盖率（cobertura.xml），消除重复执行
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingxi
          POSTGRES_PASSWORD: bingxi_test
          POSTGRES_DB: bingxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 集成测试所需的数据库连接串（指向 service container）
      DATABASE_URL: postgres://bingxi:bingxi_test@localhost:5432/bingxi_test
      # 审计模块所需的密钥（仅 CI 用途，禁止用于生产）
      AUDIT_SECRET_KEY: ci-only-audit-signing-key-do-not-use-in-prod-32b
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Rust（llvm-tools-preview + 系统依赖含 postgresql-client）
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          system-deps: pkg-config libssl-dev postgresql-client protobuf-compiler

      - name: 安装 cargo-llvm-cov 与 cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: 运行测试 + 收集覆盖率（cargo llvm-cov nextest，零容忍）
        working-directory: backend
        # nextest 每个测试独立进程 + 真正并行；llvm-cov source-based instrumentation（行/区域/分支覆盖）
        # --cobertura 输出兼容 Codecov；保留 --test-threads=1 与历史串行行为一致（避免集成测试竞态）
        run: |
          mkdir -p reports coverage
          set +e
          cargo llvm-cov nextest \
            --cobertura --output-path coverage/cobertura.xml \
            --no-clean \
            -- --test-threads=1 > reports/llvm-cov-nextest-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          # 统计测试结果（nextest 输出格式："PASS" / "FAIL" 行）
          PASSED=$(awk '/^ PASS /{c++} END{print c+0}' reports/llvm-cov-nextest-output.txt 2>/dev/null)
          FAILED=$(awk '/^ FAIL /{c++} END{print c+0}' reports/llvm-cov-nextest-output.txt 2>/dev/null)
          TOTAL=$((PASSED + FAILED))

          # 提取覆盖率摘要（从 llvm-cov report 输出）
          COVERAGE_SUMMARY="N/A"
          if [ -f coverage/cobertura.xml ]; then
            LINE_RATE=$(grep -o 'line-rate="[^"]*"' coverage/cobertura.xml | head -1 | cut -d'"' -f2)
            if [ -n "$LINE_RATE" ]; then
              COVERAGE_PCT=$(awk -v r="$LINE_RATE" 'BEGIN{printf "%.2f", r*100}')
              COVERAGE_SUMMARY="${COVERAGE_PCT}%"
            fi
          fi

          {
            echo "# Rust 测试 + 覆盖率报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**模式**: 零容忍（任何测试失败阻塞 CI）  "
            echo "**通过**: $PASSED  "
            echo "**失败**: $FAILED  "
            echo "**总计**: $TOTAL  "
            echo "**行覆盖率**: $COVERAGE_SUMMARY  "
            echo "**工具**: cargo-llvm-cov nextest（source-based instrumentation）"
            echo ""
            if [ "$FAILED" -eq "0" ]; then
              echo "## ✅ 所有 $PASSED 个测试通过（零容忍通过）"
              echo ""
              echo "覆盖率：$COVERAGE_SUMMARY（信息性，不阻塞 CI）"
            else
              echo "## ❌ 发现 $FAILED 个测试失败（零容忍，CI 失败）"
              echo ""
              echo "### 失败列表"
              echo ""
              grep -E "^ FAIL " reports/llvm-cov-nextest-output.txt 2>/dev/null | head -30
              echo ""
              echo "### 失败详情"
              echo ""
              grep -A 10 "^ FAIL " reports/llvm-cov-nextest-output.txt | head -60
            fi
          } > reports/cargo-test-report.md

          {
            echo "## Rust 测试 + 覆盖率"
            echo ""
            if [ "$FAILED" -eq "0" ]; then
              echo "✅ 通过 $PASSED / $TOTAL（零容忍模式）"
              echo "📊 行覆盖率：$COVERAGE_SUMMARY"
            else
              echo "❌ 失败 $FAILED / $TOTAL（零容忍，CI 失败）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 零容忍：任何测试失败都阻塞 CI
          if [ "$FAILED" -gt "0" ]; then
            echo ""
            echo "❌ 发现 $FAILED 个测试失败，CI 失败（零容忍）"
            echo "详见 reports/cargo-test-report.md 和 artifacts"
            exit 1
          fi
          echo "✅ 所有 $PASSED 个测试通过（覆盖率：$COVERAGE_SUMMARY）"
          exit 0

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: reports/
          retention-days: 90

      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: backend/coverage/cobertura.xml
          fail_ci_if_error: false
          flags: rust
          name: rust-coverage

      - name: 上传覆盖率报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: backend/coverage/
          retention-days: 30

# ==============================================================================
# Job 8: 前端测试
# ==============================================================================
  ci-test-fe:
    name: 🧪 前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-info
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 运行 vitest
        working-directory: frontend
        run: |
          mkdir -p reports
          set +e
          # V15 批次 06 P1-12 修复：添加 --coverage 启用覆盖率收集
          # 配合 vitest.config.ts 的 thresholds（60% 门槛）与根目录 codecov.yml
          npx vitest run --coverage --reporter=default --reporter=junit --outputFile.reporter=junit=reports/vitest-junit.xml 2>&1 \
            | tee reports/vitest-output.txt
          EXIT_CODE=$?
          set -e

          # 解析测试结果（vitest 输出格式）
          PASSED=$(awk '/✓|✔|PASS/{c++} END{print c+0}' reports/vitest-output.txt 2>/dev/null)
          FAILED=$(awk '/✗|×|FAIL/{c++} END{print c+0}' reports/vitest-output.txt 2>/dev/null)

          {
            echo "# 前端 Vitest 测试报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**退出码**: $EXIT_CODE  "
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 所有测试通过"
            else
              echo "## ❌ 测试失败"
              echo ""
              echo "### 报告内容"
              echo ""
              echo '```'
              tail -100 reports/vitest-output.txt
              echo '```'
            fi
          } > reports/vitest-report.md

          {
            echo "## 前端测试"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 通过"
            else
              echo "❌ 失败（详见 artifacts）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 上传前端覆盖率到 Codecov（V15 批次 06 P1-12）
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: frontend
          file: frontend/coverage/coverage-final.json
          fail_ci_if_error: false
          flags: frontend
          name: frontend-coverage

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: reports/
          retention-days: 90

# ==============================================================================
# Job 9: 依赖审计（严格化，发现命令错误时阻塞 CI）
# ==============================================================================
  ci-audit:
    name: 🛡️ 依赖审计
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-info
    # 批次 21 修复：移除 continue-on-error，让审计命令本身失败时阻塞 CI。
    # 注意：审计步骤内部使用 set +e 捕获漏洞，发现漏洞不会让步骤失败，
    # 只有 cargo audit / npm audit 命令本身异常时才会阻塞。
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: 安装 cargo-audit
        # 规则 5：移除 || true 降级，安装失败阻塞 CI（与 L1406 注释"移除 continue-on-error"一致）
        run: cargo install cargo-audit --locked

      - name: 审计 Rust 依赖
        working-directory: backend
        run: |
          mkdir -p reports
          set +e
          cargo audit --json 2>reports/cargo-audit.json | tee reports/cargo-audit.txt
          EXIT_CODE=$?
          set -e

          # 解析关键指标
          VULN_COUNT=$(jq '.vulnerabilities.found' reports/cargo-audit.json 2>/dev/null || echo 0)

          {
            echo "# Rust 依赖审计报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**发现漏洞**: $VULN_COUNT  "
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 无已知漏洞"
            else
              echo "## ⚠️  发现 $VULN_COUNT 个已知漏洞"
              echo ""
              echo "### 漏洞详情"
              echo ""
              echo '```'
              jq -r '.vulnerabilities.list[]? | "[\(.severity)] \(.package.name) \(.package.version) - \(.advisory.title)"' reports/cargo-audit.json 2>/dev/null | head -30
              echo '```'
              echo ""
              echo "修复：升级到 \`cargo audit fix\` 或手动调整 Cargo.toml"
            fi
          } > reports/cargo-audit-report.md

          {
            echo "## Rust 依赖审计"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 无漏洞"
            else
              echo "⚠️  $VULN_COUNT 个漏洞（不阻塞，记录在案）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 审计前端依赖
        working-directory: frontend
        run: |
          mkdir -p reports
          set +e
          npm audit --json 2>reports/npm-audit.json | tee reports/npm-audit.txt
          EXIT_CODE=$?
          set -e

          VULN_COUNT=$(jq '.metadata.vulnerabilities | to_entries | map(.value) | add' reports/npm-audit.json 2>/dev/null || echo 0)

          {
            echo "# 前端 npm audit 报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**发现漏洞**: $VULN_COUNT  "
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "## ✅ 无已知漏洞"
            else
              echo "## ⚠️  发现 $VULN_COUNT 个已知漏洞"
              echo ""
              echo "### 漏洞详情"
              echo ""
              echo '```'
              jq -r '.vulnerabilities | to_entries[] | "[\(.value.severity)] \(.key) - \(.value.via[0].title // "N/A")"' reports/npm-audit.json 2>/dev/null | head -30
              echo '```'
              echo ""
              echo "修复：\`npm audit fix\` 或 \`npm audit fix --force\`"
            fi
          } > reports/npm-audit-report.md

          {
            echo "## 前端依赖审计"
            echo ""
            if [ "$EXIT_CODE" -eq "0" ]; then
              echo "✅ 无漏洞"
            else
              echo "⚠️  $VULN_COUNT 个漏洞（不阻塞，记录在案）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: reports/
          retention-days: 90

# ==============================================================================
# Job 10: 依赖图记录
# ==============================================================================
  ci-deps:
    name: 📦 依赖图记录
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-info
    # P3-8 修复：移除 job 级 continue-on-error，改为 step 级精细控制
    # cargo tree --locked 失败时阻塞 CI（暴露 lockfile 漂移），npm ls 非关键允许失败
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: 生成 cargo tree（严格：lockfile 漂移时阻塞 CI）
        working-directory: backend
        run: |
          mkdir -p reports
          # --locked 要求 Cargo.lock 与 Cargo.toml 一致，漂移时 exit != 0 阻塞 CI
          cargo tree --locked --charset ascii > reports/cargo-tree.txt 2>&1
          cargo tree --locked --charset ascii --format json > reports/cargo-tree.json 2>&1
          echo "cargo tree 行数: $(wc -l < reports/cargo-tree.txt)"

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 生成 npm ls（非关键，允许失败）
        working-directory: frontend
        continue-on-error: true
        run: |
          mkdir -p reports
          npm ls --all --json > reports/npm-ls.json 2>reports/npm-ls.txt
          echo "npm ls 顶层依赖数: $(jq '.dependencies | length' reports/npm-ls.json 2>/dev/null || echo N/A)"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-trees
          path: reports/
          retention-days: 90

# ==============================================================================
# Job 10.5: 性能基准回归监控（V15 批次 06 P1-10 修复）
# ==============================================================================
# 设计原则：
# - 仅在 main/master 分支与 tag 触发，不阻塞主 CI（informational job）
# - 运行 cargo bench 收集 4 项关键 service 基准：库存核算 / 凭证生成 / 染整成本归集 / 产量工资
# - 首次运行建立基线（target/criterion/），后续运行与基线对比，回归 > 10% 写入告警
# - 报告作为 artifact 上传，供后续 PR 检索
  ci-perf-bench:
    name: ⚡ 性能基准回归监控
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-info
    # V15 批次 06 P1-10：informational job，continue-on-error 避免性能波动阻塞主 CI
    # 性能回归 > 10% 会写入报告并标注，但不阻塞合并（避免硬件差异导致误报）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Rust（共享主 cargo- 缓存，加速依赖编译）
        uses: ./.github/actions/setup-rust

      - name: 缓存 criterion 基线数据
        uses: actions/cache@v5
        with:
          path: backend/target/criterion
          key: criterion-${{ env.RUST_VERSION }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            criterion-${{ env.RUST_VERSION }}-

      - name: 运行 cargo bench（V15 批次 06 P1-10）
        working-directory: backend
        run: |
          mkdir -p reports
          set +e
          # 运行 4 项关键 service 性能基准（库存核算 / 凭证生成 / 染整成本归集 / 产量工资）
          # criterion 自动建立基线并对比；首次运行无基线时只采集数据
          BENCHES=(
            "inventory_calculation"
            "voucher_generation"
            "dye_cost_collection"
            "wage_calculation"
          )
          EXIT_CODE=0
          for bench in "${BENCHES[@]}"; do
            echo "运行基准：$bench"
            if cargo bench --bench "$bench" -- --save-baseline "main" > "reports/bench-${bench}.log" 2>&1; then
              echo "✅ $bench 完成"
            else
              echo "⚠️ $bench 失败（不影响主 CI）"
              EXIT_CODE=1
            fi
          done
          set -e

          # 汇总报告
          {
            echo "# 性能基准回归监控报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**分支**: ${{ github.ref_name }}  "
            echo "**Commit**: ${{ github.sha }}  "
            echo ""
            echo "## 基准项目"
            echo ""
            echo "| 基准 | 状态 | 详情 |"
            echo "|------|------|------|"
            for bench in "${BENCHES[@]}"; do
              if [ -f "reports/bench-${bench}.log" ]; then
                if grep -q "performance has improved\|Performance has regressed\|No change" "reports/bench-${bench}.log" 2>/dev/null; then
                  REGRESSION=$(awk '/Performance has regressed/{c++} END{print c+0}' "reports/bench-${bench}.log" 2>/dev/null)
                  if [ "$REGRESSION" -gt "0" ]; then
                    echo "| $bench | ⚠️ 检测到回归（$REGRESSION 处） | 见日志 |"
                  else
                    echo "| $bench | ✅ 正常 | 见日志 |"
                  fi
                else
                  echo "| $bench | ✅ 基线采集（首次） | 见日志 |"
                fi
              else
                echo "| $bench | ❌ 失败 | 无日志 |"
              fi
            done
            echo ""
            echo "## 回归阈值"
            echo ""
            echo "- 回归 > 10% 时 criterion 自动在日志中标记 `Performance has regressed`"
            echo "- 本 job 不阻塞主 CI（continue-on-error: true），仅作为监控告警"
            echo "- 详细日志见 artifacts: \`perf-bench-report\`"
          } > reports/perf-bench-report.md

          exit 0

      - name: 写入 Step Summary
        if: always()
        run: |
          if [ -f backend/reports/perf-bench-report.md ]; then
            cat backend/reports/perf-bench-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传性能基准报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench-report
          path: backend/reports/
          retention-days: 90

# ==============================================================================
# Job 11: Rust 后端构建（严格化 + 详细日志）
# ==============================================================================
  ci-build-rust:
    name: 🏗️ Rust 后端构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-info
    # 启用 contents: write 以便提交自动生成的 Cargo.lock 与版本号更新
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 确保 Cargo.lock 存在（构建可重复性）
        run: |
          # PR #238 移除了 --locked 但未生成 Cargo.lock，导致每次 cargo build 重新解析依赖
          # 这里确保 backend/Cargo.lock 存在并纳入版本控制
          if [ ! -f "backend/Cargo.lock" ]; then
            echo "📝 backend/Cargo.lock 不存在，自动生成"
            cd backend
            cargo generate-lockfile
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add backend/Cargo.lock
            if git commit -m "chore(deps): 生成 backend/Cargo.lock 锁定依赖版本"; then
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git push origin HEAD:${{ github.ref_name }} || echo "⚠️  Cargo.lock push 失败，请人工干预"
            else
              echo "⚠️  没有 diff 提交"
            fi
          else
            echo "✅ backend/Cargo.lock 已存在"
          fi

      - name: 生成版本号
        id: version
        run: |
          export TZ="Asia/Shanghai"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            YEAR=$(date +'%Y')
            MONTH=$(date +'%-m')
            DAY=$(date +'%-d')
            HOUR=$(date +'%-H')
            MIN=$(date +'%-M')
            TIME=$((HOUR * 100 + MIN))
            VERSION="${YEAR}.${MONTH}${DAY}.${TIME}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "构建版本: $VERSION"

      - name: 更新 Cargo.toml 版本号
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' backend/Cargo.toml
          echo "更新后版本: $(grep '^version' backend/Cargo.toml)"

      - name: Setup Rust（系统依赖）
        uses: ./.github/actions/setup-rust
        with:
          system-deps: pkg-config libssl-dev protobuf-compiler

      - name: 构建后端 (Release)
        working-directory: backend
        run: |
          mkdir -p reports
          echo "🔨 开始构建后端（详细日志输出到 reports/cargo-build.log）"
          cargo build --release --bin server --bin bingxi --verbose 2>&1 \
            | tee reports/cargo-build.log
          echo "✅ cargo build 完成"

      - name: 验证后端可执行文件
        run: |
          mkdir -p reports
          {
            echo "# 后端构建验证"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo ""
            for bin in server bingxi; do
              if [ -f "backend/target/release/$bin" ]; then
                SIZE=$(du -h "backend/target/release/$bin" | cut -f1)
                TYPE=$(file "backend/target/release/$bin" | cut -d: -f2)
                echo "## ✅ $bin"
                echo ""
                echo "- 路径: \`backend/target/release/$bin\`"
                echo "- 大小: $SIZE"
                echo "- 类型: $TYPE"
                echo ""
              else
                echo "## ❌ $bin 未生成"
                echo ""
                exit 1
              fi
            done
            echo "## 构建统计"
            echo ""
            echo "- 目标目录大小: $(du -sh backend/target/release/ | cut -f1)"
            echo "- 构建时长: $(grep -E 'Finished' reports/cargo-build.log | tail -1)"
          } > reports/build-verify.md
          cat reports/build-verify.md

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: reports/
          retention-days: 90

      - name: 上传后端产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: |
            backend/target/release/server
            backend/target/release/bingxi
          retention-days: 30

      - name: 写入 Step Summary
        run: |
          {
            echo "## Rust 后端构建"
            echo ""
            if [ -f "backend/target/release/server" ] && [ -f "backend/target/release/bingxi" ]; then
              echo "✅ 构建成功"
              echo "- server: $(du -h backend/target/release/server | cut -f1)"
              echo "- bingxi: $(du -h backend/target/release/bingxi | cut -f1)"
              echo "- 版本: ${{ steps.version.outputs.version }}"
            else
              echo "❌ 构建失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ==============================================================================
# Job 12: 前端构建
# ==============================================================================
  ci-build-fe:
    name: 🏗️ 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci-info
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: 构建前端
        working-directory: frontend
        run: |
          mkdir -p reports
          echo "🔨 开始构建前端（详细日志输出到 reports/vite-build.log）"
          npx vite build --mode production 2>&1 | tee reports/vite-build.log
          echo "✅ vite build 完成"

      - name: 验证前端构建产物
        run: |
          mkdir -p reports
          {
            echo "# 前端构建验证"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo ""
            if [ -d "frontend/dist" ]; then
              FILE_COUNT=$(find frontend/dist -type f | wc -l)
              TOTAL_SIZE=$(du -sh frontend/dist | cut -f1)
              echo "## ✅ dist 目录已生成"
              echo ""
              echo "- 文件数: $FILE_COUNT"
              echo "- 总大小: $TOTAL_SIZE"
              echo ""
              echo "### 顶层文件"
              echo ""
              echo '```'
              ls -lh frontend/dist/ | head -20
              echo '```'
            else
              echo "## ❌ dist 目录未生成"
              exit 1
            fi
          } > reports/build-verify-fe.md
          cat reports/build-verify-fe.md

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: reports/
          retention-days: 90

      - name: 上传前端产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

      - name: 写入 Step Summary
        run: |
          {
            echo "## 前端构建"
            echo ""
            if [ -d "frontend/dist" ]; then
              FILE_COUNT=$(find frontend/dist -type f | wc -l)
              TOTAL_SIZE=$(du -sh frontend/dist | cut -f1)
              echo "✅ 构建成功"
              echo "- 文件数: $FILE_COUNT"
              echo "- 总大小: $TOTAL_SIZE"
            else
              echo "❌ 构建失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ==============================================================================
# Job 13: 打包发布
# ==============================================================================
  package-release:
    name: 📦 打包发布
    needs: [
      ci-info,
      ci-fmt-rust,
      ci-fmt-fe,
      ci-lint-rust,
      ci-lint-fe,
      ci-type-check,
      ci-test-rust,
      ci-test-fe,
      ci-build-rust,
      ci-build-fe
    ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    outputs:
      version: ${{ needs.ci-build-rust.outputs.version }}
      tag_name: v${{ needs.ci-build-rust.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 使用编译时的版本号
        id: version
        run: |
          VERSION="${{ needs.ci-build-rust.outputs.version }}"
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "使用编译时的版本: $VERSION"

      - name: 更新版本号文件
        run: |
          echo "${{ needs.ci-build-rust.outputs.version }}" > VERSION
          cat VERSION

      - name: 提交版本号更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/Cargo.toml
          if git diff --cached --quiet; then
            echo "版本号未发生变化，跳过提交"
          else
            git commit -m "chore(release): 自动更新版本号至 ${{ steps.version.outputs.version }}"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:${{ github.ref_name }} || echo "推送失败，可能有冲突"
          fi

      - name: 下载后端产物
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: release/backend

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend/dist

      - name: 准备发布包目录结构
        run: |
          mkdir -p release/bingxi-erp/backend
          mkdir -p release/bingxi-erp/frontend
          mkdir -p release/bingxi-erp/deploy
          mkdir -p release/bingxi-erp/docs

          chmod +x release/backend/server release/backend/bingxi
          cp release/backend/server release/bingxi-erp/backend/
          cp release/backend/bingxi release/bingxi-erp/backend/
          cp backend/.env.example release/bingxi-erp/backend/
          # 批次 28 v7 P0-3 修复：config.yaml 已从版本库移除，发布包改用 config.yaml.example 模板
          # 实际生产配置由 deploy-latest.sh 在服务器上基于 /etc/bingxi/.env 生成
          cp backend/config.yaml.example release/bingxi-erp/backend/config.yaml.example 2>/dev/null || true
          cp backend/config.test.yaml.example release/bingxi-erp/backend/ 2>/dev/null || true

          cp -r release/frontend/dist release/bingxi-erp/frontend/

          cp -r deploy/* release/bingxi-erp/deploy/

          if [ -d "backend/database" ]; then
            cp -r backend/database release/bingxi-erp/ 2>/dev/null || true
          fi

          if [ -d "database/migration" ]; then
            mkdir -p release/bingxi-erp/database
            cp -r database/migration release/bingxi-erp/database/
          fi

          cp README.md release/bingxi-erp/ 2>/dev/null || true

          echo "发布包目录结构："
          ls -la release/bingxi-erp/

      - name: 创建 TAR.GZ 发布包
        working-directory: release
        run: |
          TAR_NAME="release-${{ steps.version.outputs.version }}.tar.gz"
          tar -czf "../$TAR_NAME" bingxi-erp/
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
          echo "发布包大小："
          ls -lh "../$TAR_NAME"

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-release
          path: release-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

# ==============================================================================
# Job 14: GitHub Release
# ==============================================================================
  github-release:
    name: 🚀 GitHub Release
    needs: package-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载发布包
        uses: actions/download-artifact@v4
        with:
          name: bingxi-erp-release
          path: ./

      - name: 生成发布说明（按 RELEASE_TEMPLATE.md 模板）
        id: release-notes
        run: |
          VERSION="${{ needs.package-release.outputs.version }}"
          TAG_NAME="${{ needs.package-release.outputs.tag_name }}"
          NOW=$(date +'%Y-%m-%d %H:%M:%S %Z')

          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 获取 commit 列表（完整 hash + message）
          if [ -z "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log --pretty=format:"%H %s" --no-merges -n 200)
            COMMIT_RANGE="初始版本（最近 200 个提交）"
          else
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%H %s" --no-merges)
            COMMIT_RANGE="${PREV_TAG}..${TAG_NAME}"
          fi

          COMMIT_COUNT=$(printf "%s\n" "$COMMIT_LOG" | awk 'NF{c++} END{print c+0}')

          # ============================================================================
          # 按 Conventional Commits 规范分类解析 commit
          # ============================================================================
          FEAT_LIST=""
          FIX_LIST=""
          MODIFIED_LIST=""
          REMOVED_LIST=""
          BREAKING_LIST=""
          DOCS_LIST=""
          TEST_LIST=""
          CHORE_LIST=""
          OTHER_LIST=""

          # 带文件级变更明细的完整 commit 列表
          FULL_DETAILED_LIST=""

          FEAT_COUNT=0
          FIX_COUNT=0
          MODIFIED_COUNT=0
          REMOVED_COUNT=0
          BREAKING_COUNT=0
          DOCS_COUNT=0
          TEST_COUNT=0
          CHORE_COUNT=0
          OTHER_COUNT=0

          # 提取 commit 短 hash 用于显示
          SHORT_HASH=""
          FIRST_FEAT_FIX=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            HASH=$(echo "$line" | cut -d' ' -f1)
            SHORT_HASH=$(echo "$HASH" | cut -c1-8)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            DISPLAY="- \`${SHORT_HASH}\` ${MSG}"

            # 文件级变更明细：新增 / 修改 / 删除，逐条附加到该 commit 条目下
            # 使用 --no-renames 使重命名拆分为 删除+新增 两条，便于读者理解
            while IFS=$'\t' read -r fstat fpath; do
              case "$fstat" in
                A|C) DISPLAY="${DISPLAY}\n  - 🆕 \`${fpath}\`" ;;
                M|T|R) DISPLAY="${DISPLAY}\n  - ✏️ \`${fpath}\`" ;;
                D) DISPLAY="${DISPLAY}\n  - 🗑️ \`${fpath}\`" ;;
              esac
            done < <(git show --name-status --pretty=format: --no-renames "$HASH" 2>/dev/null)

            FULL_DETAILED_LIST="${FULL_DETAILED_LIST}${DISPLAY}\n"

            # 检测 breaking change（BREAKING CHANGE: 或 type!: 语法）
            IS_BREAKING=0
            if echo "$MSG" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$MSG" | grep -qi 'BREAKING CHANGE'; then
              IS_BREAKING=1
            fi

            # 按 conventional commit 前缀分类
            TYPE=$(echo "$MSG" | grep -oE '^[a-z]+' | head -1)

            case "$TYPE" in
              feat)
                FEAT_LIST="${FEAT_LIST}${DISPLAY}\n"
                FEAT_COUNT=$((FEAT_COUNT + 1))
                [ -z "$FIRST_FEAT_FIX" ] && FIRST_FEAT_FIX="$MSG"
                ;;
              fix)
                FIX_LIST="${FIX_LIST}${DISPLAY}\n"
                FIX_COUNT=$((FIX_COUNT + 1))
                [ -z "$FIRST_FEAT_FIX" ] && FIRST_FEAT_FIX="$MSG"
                ;;
              refactor|perf|style)
                MODIFIED_LIST="${MODIFIED_LIST}${DISPLAY}\n"
                MODIFIED_COUNT=$((MODIFIED_COUNT + 1))
                ;;
              remove)
                REMOVED_LIST="${REMOVED_LIST}${DISPLAY}\n"
                REMOVED_COUNT=$((REMOVED_COUNT + 1))
                ;;
              docs)
                DOCS_LIST="${DOCS_LIST}${DISPLAY}\n"
                DOCS_COUNT=$((DOCS_COUNT + 1))
                ;;
              test)
                TEST_LIST="${TEST_LIST}${DISPLAY}\n"
                TEST_COUNT=$((TEST_COUNT + 1))
                ;;
              chore|build|ci)
                # 检查是否是删除类（chore(remove) / chore(delete)）
                if echo "$MSG" | grep -qE '^chore\((remove|delete)\)'; then
                  REMOVED_LIST="${REMOVED_LIST}${DISPLAY}\n"
                  REMOVED_COUNT=$((REMOVED_COUNT + 1))
                else
                  CHORE_LIST="${CHORE_LIST}${DISPLAY}\n"
                  CHORE_COUNT=$((CHORE_COUNT + 1))
                fi
                ;;
              *)
                OTHER_LIST="${OTHER_LIST}${DISPLAY}\n"
                OTHER_COUNT=$((OTHER_COUNT + 1))
                ;;
            esac

            # Breaking change 单独归入"变更"章节
            if [ "$IS_BREAKING" -eq "1" ]; then
              BREAKING_LIST="${BREAKING_LIST}${DISPLAY}\n"
              BREAKING_COUNT=$((BREAKING_COUNT + 1))
            fi
          done <<< "$COMMIT_LOG"

          # 空列表显示「_无_」
          [ -z "$FEAT_LIST" ] && FEAT_LIST="_无_"
          [ -z "$FIX_LIST" ] && FIX_LIST="_无_"
          [ -z "$MODIFIED_LIST" ] && MODIFIED_LIST="_无_"
          [ -z "$REMOVED_LIST" ] && REMOVED_LIST="_无_"
          [ -z "$BREAKING_LIST" ] && BREAKING_LIST="_无_"

          # 版本概述
          if [ -n "$FIRST_FEAT_FIX" ]; then
            SUMMARY="本次版本主要更新：${FIRST_FEAT_FIX#*: }"
          else
            SUMMARY="详见下方变更分类。"
          fi

          # 完整 commit 列表（带文件级变更明细）
          if [ -z "$FULL_DETAILED_LIST" ]; then
            FULL_LOG_FORMATTED="_无_"
          else
            FULL_LOG_FORMATTED=$(echo -e "$FULL_DETAILED_LIST")
          fi

          # 统计合计
          TOTAL_COUNT=$((FEAT_COUNT + FIX_COUNT + MODIFIED_COUNT + REMOVED_COUNT + BREAKING_COUNT + DOCS_COUNT + TEST_COUNT + CHORE_COUNT + OTHER_COUNT))

          # ============================================================================
          # 按 RELEASE_TEMPLATE.md 模板生成 release notes
          # ============================================================================
          cat > release_notes.md << EOF
          # Bingxi ERP ${VERSION}

          **发布时间**: ${NOW}
          **上一版本**: ${PREV_TAG:-无（首个版本）}
          **Commit 范围**: ${COMMIT_RANGE}（共 ${COMMIT_COUNT} 个提交）

          ---

          ## 📋 版本概述

          ${SUMMARY}

          ---

          ## 🆕 新增（feat）

          $(echo -e "$FEAT_LIST")

          ## ✏️ 修改（refactor / perf / style）

          $(echo -e "$MODIFIED_LIST")

          ## 🗑️ 删除（remove / chore-delete）

          $(echo -e "$REMOVED_LIST")

          ## 🐛 修复（fix）

          $(echo -e "$FIX_LIST")

          ## 🔄 变更（breaking / 其他变更）

          $(echo -e "$BREAKING_LIST")
          $(echo -e "$OTHER_LIST")

          ---

          ## 📊 统计

          | 类型 | 数量 |
          |------|------|
          | 新增（feat） | ${FEAT_COUNT} |
          | 修复（fix） | ${FIX_COUNT} |
          | 修改（refactor/perf/style） | ${MODIFIED_COUNT} |
          | 删除（remove） | ${REMOVED_COUNT} |
          | 变更（breaking） | ${BREAKING_COUNT} |
          | 文档（docs） | ${DOCS_COUNT} |
          | 测试（test） | ${TEST_COUNT} |
          | 构建/工具（chore） | ${CHORE_COUNT} |
          | **合计** | **${TOTAL_COUNT}** |

          ---

          ## 📝 完整 Commit 列表

          ${FULL_LOG_FORMATTED}

          ---

          ## 🚀 快速部署

          \`\`\`bash
          # 解压发布包
          tar -xzf release-${VERSION}.tar.gz
          cd bingxi-erp

          # 部署后端
          cp backend/server /opt/bingxi-erp/backend/
          systemctl restart bingxi-backend

          # 部署前端
          cp -r frontend/dist/* /var/www/html/
          \`\`\`

          ## 🛠️ 技术栈

          - **后端**: Rust + Axum + SeaORM
          - **前端**: Vue 3 + TypeScript + Element Plus
          - **数据库**: PostgreSQL 14+

          ---

          *此发布说明由 CI 自动生成，依据 \`.github/RELEASE_TEMPLATE.md\` 模板格式化。*
          EOF

          echo "✅ release notes 已生成（共 ${COMMIT_COUNT} 个提交，feat=${FEAT_COUNT} fix=${FIX_COUNT}）"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package-release.outputs.tag_name }}
          name: Bingxi ERP ${{ needs.package-release.outputs.version }}
          body_path: release_notes.md
          files: release-${{ needs.package-release.outputs.version }}.tar.gz
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧 Release（保留最近 10 个）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理超过 10 个的旧 Release..."
          # 用 gh CLI 替代 curl+jq（runner 预装 gh，更简洁且自带分页/错误处理）
          mapfile -t releases < <(gh release list --repo ${{ github.repository }} --limit 100 --json tagName -q '.[].tagName' | sort -V)
          total=${#releases[@]}
          echo "总共找到 $total 个 Release"

          if [ "$total" -gt 10 ]; then
            for tag in "${releases[@]:0:$((total - 10))}"; do
              echo "删除 Release: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
            done
          fi

# ==============================================================================
# Job 15: 收尾清理 + 失败自动重跑
# ==============================================================================
# 需求（用户指令）：CI 快收尾时，只要有步骤失败或报错，则移除项目使用的所有
# 缓存/数据/工具/依赖等（GitHub Actions 缓存、npm/node_modules、cargo/rustup 等），
# 使用全新环境重跑全流程。
#
# 设计：
#   - needs 全部验证 job（含打包/发布链），if: always() 确保即使前置失败也执行收尾
#   - 汇总各 job 结果：任一 failure/cancelled 即触发清理 + 重跑
#   - 清理手段：删除本仓库全部 actions/cache 缓存条目（cargo-/rustup-/fe-npm-/criterion-）
#   - 重跑手段：gh workflow run 重新触发 workflow_dispatch（带 retry_count 递增防无限循环）
#   - 防循环：workflow_dispatch inputs.retry_count 记录重试次数，达到上限（2）后不再重跑
# ==============================================================================
  ci-cleanup-retry:
    name: 🧹 收尾清理 + 失败重跑
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [
      ci-info,
      ci-fmt-rust,
      ci-fmt-fe,
      ci-lint-rust,
      ci-lint-fe,
      ci-type-check,
      ci-test-rust,
      ci-test-fe,
      ci-audit,
      ci-deps,
      ci-perf-bench,
      ci-build-rust,
      ci-build-fe,
      package-release,
      github-release
    ]
    if: always()
    permissions:
      actions: write
      contents: read
    outputs:
      all_success: ${{ steps.collect.outputs.all_success }}
    steps:
      - name: 收集各 job 结果
        id: collect
        run: |
          FAILED_JOBS=""
          CANCELLED_JOBS=""
          declare -A RESULTS=(
            ["ci-info"]="${{ needs.ci-info.result }}"
            ["ci-fmt-rust"]="${{ needs.ci-fmt-rust.result }}"
            ["ci-fmt-fe"]="${{ needs.ci-fmt-fe.result }}"
            ["ci-lint-rust"]="${{ needs.ci-lint-rust.result }}"
            ["ci-lint-fe"]="${{ needs.ci-lint-fe.result }}"
            ["ci-type-check"]="${{ needs.ci-type-check.result }}"
            ["ci-test-rust"]="${{ needs.ci-test-rust.result }}"
            ["ci-test-fe"]="${{ needs.ci-test-fe.result }}"
            ["ci-audit"]="${{ needs.ci-audit.result }}"
            ["ci-deps"]="${{ needs.ci-deps.result }}"
            ["ci-perf-bench"]="${{ needs.ci-perf-bench.result }}"
            ["ci-build-rust"]="${{ needs.ci-build-rust.result }}"
            ["ci-build-fe"]="${{ needs.ci-build-fe.result }}"
            ["package-release"]="${{ needs.package-release.result }}"
            ["github-release"]="${{ needs.github-release.result }}"
          )
          ALL_OK=1
          for key in "${!RESULTS[@]}"; do
            R="${RESULTS[$key]}"
            # success / skipped（非主分支 job 被跳过）视为通过；cancelled 是并发取消，不触发重跑
            if [[ "$R" == "success" || "$R" == "skipped" ]]; then
              continue
            elif [[ "$R" == "cancelled" ]]; then
              CANCELLED_JOBS="$CANCELLED_JOBS $key"
            else
              ALL_OK=0
              FAILED_JOBS="$FAILED_JOBS $key=$R"
            fi
          done
          echo "all_success=$ALL_OK" >> "$GITHUB_OUTPUT"
          echo "failed_jobs=$FAILED_JOBS" >> "$GITHUB_OUTPUT"
          echo "cancelled_jobs=$CANCELLED_JOBS" >> "$GITHUB_OUTPUT"

          # 判定是否为重跑触发（workflow_dispatch + retry_count）
          RETRY_COUNT="${{ github.event.inputs.retry_count || '0' }}"
          echo "retry_count=$RETRY_COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## 🧹 收尾清理 + 失败重跑"
            echo ""
            echo "**重试计数**: $RETRY_COUNT  "
            echo "**触发事件**: ${{ github.event_name }}  "
            echo "**全部成功**: $([ "$ALL_OK" = "1" ] && echo "是 ✅" || echo "否 ❌")  "
            if [ "$ALL_OK" = "0" ]; then
              echo "**失败 job**: \`$FAILED_JOBS\`  "
            fi
            if [ -n "$CANCELLED_JOBS" ]; then
              echo "**被取消 job（不触发重跑）**: \`$CANCELLED_JOBS\`  "
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理 GitHub Actions 缓存（全部缓存条目）
        if: steps.collect.outputs.all_success == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔧 清理本仓库全部 GitHub Actions 缓存..."
          # 列出全部缓存 ID（分页），逐条删除
          CACHE_IDS=$(gh api repos/${{ github.repository }}/actions/caches --paginate -q '.actions_caches[].id' 2>/dev/null || true)
          if [ -z "$CACHE_IDS" ]; then
            echo "  没有发现缓存条目"
          else
            COUNT=0
            for id in $CACHE_IDS; do
              echo "  删除缓存 ID=$id"
              gh api -X DELETE repos/${{ github.repository }}/actions/caches/$id >/dev/null 2>&1 && COUNT=$((COUNT + 1)) || echo "    删除失败（可能已被删除）"
            done
            echo "✅ 共删除 $COUNT 个缓存条目"
          fi
          {
            echo "### 缓存清理结果"
            echo ""
            echo "已删除缓存条目：${COUNT:-0} 个（cargo- / rustup- / fe-npm- / criterion- 前缀的 actions/cache 全部清除）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理本地依赖与工具链
        if: steps.collect.outputs.all_success == '0'
        run: |
          echo "🔧 清理本地数据/依赖/工具链（本 runner 将在 job 结束后销毁，主要防残留）..."
          rm -rf frontend/node_modules ~/.npm ~/.cargo/registry ~/.cargo/git backend/target 2>/dev/null || true
          echo "✅ 本地依赖清理完成（node_modules / ~/.npm / cargo registry / target）"

      - name: 自动重跑全流程
        if: steps.collect.outputs.all_success == '0' && steps.collect.outputs.retry_count < '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETRY_COUNT="${{ steps.collect.outputs.retry_count }}"
          NEXT=$((RETRY_COUNT + 1))
          # PR 场景重新触发到 PR 源分支，push 场景触发到当前分支
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RUN_REF="${{ github.head_ref }}"
          else
            RUN_REF="${{ github.ref_name }}"
          fi
          echo "🚀 检测到失败，使用全新环境重跑全流程（第 $NEXT 次重跑，ref=$RUN_REF）..."
          gh workflow run ci-cd.yml \
            --ref "$RUN_REF" \
            -f retry_count=$NEXT \
            -f skip_release=true || echo "⚠️ 触发重跑失败，请手动触发 workflow_dispatch"
          {
            echo ""
            echo "### 自动重跑"
            echo ""
            echo "已触发重跑（retry_count=$NEXT，ref=$RUN_REF）。若重跑仍失败，请人工排查，避免循环重试。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 重跑次数已达上限（不再自动重跑）
        if: steps.collect.outputs.all_success == '0' && steps.collect.outputs.retry_count >= '2'
        run: |
          echo "⚠️ 已重试 ${{ steps.collect.outputs.retry_count }} 次仍失败，停止自动重跑，请人工介入排查。"
          {
            echo ""
            echo "### ⚠️ 停止自动重跑"
            echo ""
            echo "已达最大重试次数（2），停止自动重跑。请人工排查失败原因。"
          } >> "$GITHUB_STEP_SUMMARY"
