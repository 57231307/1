# Bingxi ERP 安卓客户端（Tauri v2）CI：构建 + 严格冒烟 + 模拟器 E2E。
#
# 部署服务器地址由 App 首装手填（不烘进包）。CI 只做：安卓端变更→出可安装 APK→严格校验产物→
# 模拟器装包跑 E2E。独立于 ci-cd.yml。本机无 Android 工具链，全部在 CI 跑。
#
# 安全：仅受信触发或同仓 PR；不将任何 GitHub event 载荷拼进 shell；输入经校验。
# PR 触发只跑 debug 构建与模拟器 E2E，签名与发布步骤由 BUILD_RELEASE 输入控制，PR 下恒为 false，不接触签名 secret。
name: Android (Tauri)

on:
  # workflow_call：供 ci-cd.yml 的 📱 安卓客户端 APK job 以"可复用工作流"方式调用（甲路线）。
  # 目的是不复制第二套构建脚本：安卓链只有一份，main 发布轮和这条独立车道调的是同一段。
  workflow_call:
    inputs:
      build_release:
        description: '是否构建并签名 release APK（签名 secret 未配置时按版权方固定 DN 临时自签）'
        type: boolean
        default: false
      run_e2e:
        description: '是否跑 Android 模拟器端到端（发布轮传字符串 false，避免把发布卡在模拟器上；布尔 false 会被类型检查拒绝）'
        type: string
        default: 'false'
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建签名 release APK（签名 secret 未配置时按版权方固定 DN 临时自签）"
        type: boolean
        default: false
      run_e2e:
        description: "是否跑模拟器端到端（push 与 release 直接触发不受此输入控制，恒跑）"
        type: string
        options:
          - 'true'
          - 'false'
        default: 'true'
  # PR 触发：安卓端改动过去只在本分支 push 时跑，导致权限与插件注入等步骤在 PR 里完全没有曝光。
  # 只跑 debug 构建与模拟器 E2E；签名与发布步骤由 BUILD_RELEASE 输入控制，PR 下恒 false。
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - "feat/android-tauri-client"
    paths:
      - "mobile-app/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  release:
    types: [published]

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "26.1.10909125"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  APP_ID: "com.bingxi.erp"

jobs:
  android-apk:
    env:
      # 签名判定只认输入，不再用 event_name 猜是否被调用（可复用工作流里
      # github.event_name 是调用方触发的事件名，与是否被调用无关，旧写法的
      # workflow_call 分支恒假，导致被调用时传 true 也被静默打成 false）。
      # 被调用时读输入上下文，手工 dispatch 回退读事件输入（仅 dispatch 下有值），
      # push 或 release 直接触发两者皆无值，即 false。
      # 三种入口下 BUILD_RELEASE 与模拟器 E2E 的期望取值（run_e2e 为 dispatch 新增输入，默认 true 以保持旧行为）
      # - push 直接触发，BUILD_RELEASE 为 false，E2E 恒运行（行为不变）
      # - release 发布事件触发，BUILD_RELEASE 为 false，E2E 恒运行（行为不变）
      # - dispatch 手填 build_release true，BUILD_RELEASE 为 true，E2E 随手填 run_e2e（默认 true 即运行）
      # - dispatch 手填 build_release false，BUILD_RELEASE 为 false，E2E 随手填 run_e2e
      # - 被调用传 build_release true，BUILD_RELEASE 为 true（原缺陷即此格被静默跳过）
      # - 被调用传 run_e2e false，E2E 跳过（原缺陷即此格照跑）
      # - 被调用未传 build_release，按声明默认 false（与原生效值一致）
      # - 被调用未传 run_e2e，按声明默认 false 跳过（原缺陷此格照跑，现无此类调用方）
      BUILD_RELEASE: ${{ inputs.build_release || github.event.inputs.build_release == 'true' }}
    name: 构建 APK + 严格冒烟
    runs-on: ubuntu-latest
    outputs:
      apk_version: ${{ steps.ver.outputs.android_client_version }}
    steps:
      - uses: actions/checkout@v4

      - name: 记录安卓端版本
        id: ver
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' mobile-app/src-tauri/Cargo.toml | tr -d ' "' | cut -d= -f2)"
          echo "android_client_version=$ver" >> "$GITHUB_OUTPUT"
          {
            echo "## 安卓端出包"
            echo "- 客户端版本：$ver"
            echo "- 触发提交：${GITHUB_SHA::7}"
            echo "- 事件：$GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 严格冒烟·1 校验 tauri.conf 符合官方 Schema
        run: |
          set -euo pipefail
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json
          from jsonschema import Draft7Validator
          schema = json.load(open("mobile-app/src-tauri/tauri-v2.schema.json"))
          conf = json.load(open("mobile-app/src-tauri/tauri.conf.json"))
          errs = sorted(Draft7Validator(schema).iter_errors(conf), key=lambda e: list(e.path))
          if errs:
              for e in errs:
                  print("SCHEMA ERROR at", "/".join(map(str, e.path)), "::", e.message)
              raise SystemExit(1)
          print("tauri.conf.json 通过 vendored 官方 Tauri v2 schema 校验")
          PY

      - name: 严格冒烟·2 校验 capabilities JSON
        run: |
          set -euo pipefail
          for f in mobile-app/src-tauri/capabilities/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('JSON OK', sys.argv[1])" "$f"
          done

      - name: 严格冒烟·2.1 校验 app 命令 ACL 覆盖
        # 一旦存在 app 权限清单，远端与本地页面调用 app 命令都要 capabilities 逐条授权；
        # 漏一条不会在构建期报错，只会在运行期被 ACL 拒绝（例如 gateway 的 remember_gateway），
        # 故按 build.rs 的命令清单对两份 capabilities 逐条比对。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          build = pathlib.Path("mobile-app/src-tauri/build.rs").read_text(encoding="utf-8")
          commands = re.findall(r'"([a-z][a-z0-9_]*)"', build)
          expected = {
              "app_info",
              "remember_gateway",
              "reopen_gateway",
              "bluetooth_request_permission",
              "app_request_camera_permission",
              "bluetooth_open_settings",
              "bluetooth_list_printers",
              "bluetooth_connect",
              "bluetooth_print_text",
              "bluetooth_disconnect",
          }
          if set(commands) != expected:
              raise SystemExit(f"build.rs 命令清单与预期不一致，缺失 {sorted(expected - set(commands))}，多出 {sorted(set(commands) - expected)}")
          required = ["allow-" + c.replace("_", "-") for c in commands]
          for name in ("default.json", "remote-gateway.json"):
              path = pathlib.Path("mobile-app/src-tauri/capabilities") / name
              data = json.loads(path.read_text(encoding="utf-8"))
              perms = set(data.get("permissions", []))
              missing = sorted(set(required) - perms)
              if missing:
                  raise SystemExit(f"{name} 缺 app 命令权限 {missing}")
              print(f"{name} 覆盖 {len(required)} 条 app 命令权限")
          PY

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置 Android SDK / NDK / build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }}"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 设置 Rust 与 Android 目标三元组
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 生成应用图标
        working-directory: mobile-app
        run: cargo tauri icon app-icon.png

      - name: 初始化 Android 工程
        working-directory: mobile-app
        run: cargo tauri android init

      - name: 注入安卓权限与蓝牙打印插件
        # 调用方 严格冒烟·3 与模拟器 E2E 依赖本步产物。入参 无。
        # 做什么 向 gen/android 清单补联网/相机/经典蓝牙/文件读写权限与可选硬件声明，并把
        #        BluetoothPrintPlugin.kt（含相机权限申请命令）复制进 com.bingxi.erp 包；
        #        模板锚点或包名变化时脚本直接判红，不静默跳过。
        # 存哪里 只改 CI 现场生成的 src-tauri/gen/android，不改版本库模板。
        working-directory: mobile-app
        run: python3 scripts/patch-android.py

      - name: 放开 release 明文流量（部署地址允许 http）
        # 调用方 后续 debug 与 release 构建。入参 无。
        # 为什么 Tauri 模板只在 debug 构建类型把 usesCleartextTraffic 置 true，release 继承 defaultConfig 的 false，
        # 而服务器设置页允许用户填 http 局域网地址，release 包会以 ERR_CLEARTEXT_NOT_PERMITTED 断网。
        # 做什么 把生成工程 defaultConfig 的占位符改为 true，两种构建类型一致允许明文。
        # 存哪里 只改 CI 现场生成的 src-tauri/gen/android/app/build.gradle.kts，不进版本库。
        # 模板文本变化导致未命中时直接判红，避免补丁静默失效。
        working-directory: mobile-app
        run: |
          set -euo pipefail
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          grep -q 'manifestPlaceholders\["usesCleartextTraffic"\] = "false"' "$GRADLE" || { echo '未找到明文流量占位符默认值，Tauri 模板已变，需人工校准'; exit 1; }
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$GRADLE"
          grep -q 'manifestPlaceholders\["usesCleartextTraffic"\] = "true"' "$GRADLE" || { echo '明文流量占位符改写未生效'; exit 1; }

      - name: 构建 debug APK
        working-directory: mobile-app
        env:
          NDK_HOME: ${{ format('{0}/ndk/{1}', env.ANDROID_HOME, env.NDK_VERSION) }}
        run: cargo tauri android build --debug --apk

      - name: 严格冒烟·3 校验 APK 清单（包名/launcher/minSdk/权限/明文流量/插件类/体积）
        run: |
          set -euo pipefail
          APK="$(find mobile-app/src-tauri/gen/android/app/build/outputs/apk -path '*universal/debug/*.apk' | head -1)"
          test -n "$APK" || { echo '未找到 universal debug APK'; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          BADGE="$("$AAPT" dump badging "$APK")"
          echo "$BADGE" | grep -q "package: name='${APP_ID}'" || { echo "包名不符"; exit 1; }
          echo "$BADGE" | grep -q "launchable-activity: name=" || { echo "无 launcher activity"; exit 1; }
          echo "$BADGE" | grep -Eq "sdkVersion:'(2[4-9]|[3-9][0-9])'" || { echo "minSdk 应 >=24"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          python3 mobile-app/scripts/assert-apk-permissions.py "$APK" "$AAPT2"
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'Lcom/bingxi/erp/BluetoothPrintPlugin;' || { echo "APK 未打包蓝牙打印插件类，注入或编译未生效"; exit 1; }
          SIZE=$(stat -c%s "$APK"); echo "APK size=$SIZE"; [ "$SIZE" -gt 1000000 ] || { echo "APK 体积异常过小"; exit 1; }
          cp "$APK" /tmp/bingxi-debug.apk

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-android-debug
          path: mobile-app/src-tauri/gen/android/app/build/outputs/apk/**/universal/debug/*.apk
          if-no-files-found: error

      - name: 构建 release APK（未签名，发布轮必需产物）
        # 调用方 本文件的 准备签名证书 与 签名 release APK 两步，产物再进 上传签名 release APK。
        # 入参 无。tauri v2 的 android build 默认即 release 档，只 --debug 是选项，多传 --release 会被 CLI 判为 unexpected argument 并以退出码 2 终止。
        if: env.BUILD_RELEASE == 'true'
        working-directory: mobile-app
        env:
          NDK_HOME: ${{ format('{0}/ndk/{1}', env.ANDROID_HOME, env.NDK_VERSION) }}
        run: |
          set -euo pipefail
          cargo tauri android build --apk
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -path '*universal/release/*.apk' | head -1)"
          test -n "$APK" || { echo '未找到 universal release APK'; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          python3 scripts/assert-apk-permissions.py "$APK" "$AAPT2"

      - name: 准备签名证书
        # 调用方为本文件的签名 release APK 步与上传临时自签证书 bundle 步。入参为四枚签名 secret，经 env 注入不进命令行拼接。
        # secret 四项齐备走固定证书，全缺走 keytool 按版权方固定 DN 生成临时自签，半配判红。
        # 存什么存哪里 生成物落 RUNNER_TEMP 下 bingxi-signing 目录（keystore 与口令文件与证书），
        # 来源与指纹经 outputs 传日志，口令与 base64 经 GITHUB_ENV 传签名步，全部不进日志。
        id: signing
        if: env.BUILD_RELEASE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_DIR="$RUNNER_TEMP/bingxi-signing"
          rm -rf "$KS_DIR"
          mkdir -p "$KS_DIR"
          # 版权方名称与 LICENSE 一致，别名与包名同源，DN 全程固定不随轮次变
          DN='CN=Chengdu Bingxi Fabric Trading Co.,O=Chengdu Bingxi Fabric Trading Co.,C=CN'
          if [ -n "$KS_B64" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_STOREPASS" ] && [ -n "$KS_KEYPASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS_DIR/release.jks"
            printf '%s' "$KS_STOREPASS" > "$KS_DIR/storepass.txt"
            printf '%s' "$KS_KEYPASS" > "$KS_DIR/keypass.txt"
            printf '%s' "$KS_ALIAS" > "$KS_DIR/alias.txt"
            SOURCE=fixed
            echo "签名证书来源 固定证书（仓库 secret 配置齐全）"
          elif [ -n "$KS_B64" ] || [ -n "$KS_ALIAS" ] || [ -n "$KS_STOREPASS" ] || [ -n "$KS_KEYPASS" ]; then
            echo "::error::签名 secret 半配（ANDROID_KEYSTORE_BASE64 与 ANDROID_KEYSTORE_ALIAS 与两枚口令必须四项齐备或全缺），拒绝回退临时自签"
            exit 1
          else
            STOREPASS="$(openssl rand -hex 16)"
            KEYPASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS_DIR/release.jks" -storetype JKS \
              -alias "$APP_ID" -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "$DN" -storepass "$STOREPASS" -keypass "$KEYPASS"
            printf '%s' "$STOREPASS" > "$KS_DIR/storepass.txt"
            printf '%s' "$KEYPASS" > "$KS_DIR/keypass.txt"
            printf '%s' "$APP_ID" > "$KS_DIR/alias.txt"
            SOURCE=selfsigned
            echo "签名证书来源 临时生成（keytool 按版权方固定 DN 自签）"
            echo "本轮为临时自签，跨轮指纹变化即说明尚未固定"
            echo "固定出路 下载本 run 产物 bingxi-erp-android-selfsigned-keystore，把其中 keystore 文件转 base64 与口令两枚与别名共四项，写入 ANDROID_KEYSTORE_BASE64 与 ANDROID_KEYSTORE_ALIAS 与 ANDROID_KEYSTORE_PASSWORD 与 ANDROID_KEY_PASSWORD 四个 secret，下一轮即走固定证书路且指纹不变"
            mkdir -p "$KS_DIR/selfsigned-bundle"
            cp "$KS_DIR/release.jks" "$KS_DIR/selfsigned-bundle/bingxi-erp-android-signing.jks"
            cp "$KS_DIR/storepass.txt" "$KS_DIR/selfsigned-bundle/storepass.txt"
            cp "$KS_DIR/keypass.txt" "$KS_DIR/selfsigned-bundle/keypass.txt"
            cp "$KS_DIR/alias.txt" "$KS_DIR/selfsigned-bundle/alias.txt"
            echo "bundle 含临时 keystore 与口令与别名，产物访问权限即其保护边界，日志不落口令与 base64"
          fi
          keytool -exportcert -keystore "$KS_DIR/release.jks" \
            -storepass "$(cat "$KS_DIR/storepass.txt")" -alias "$(cat "$KS_DIR/alias.txt")" \
            -file "$KS_DIR/release.cer"
          test -s "$KS_DIR/release.cer" || { echo "::error::导出签名证书失败，无法核对指纹"; exit 1; }
          [ "$SOURCE" != "selfsigned" ] || cp "$KS_DIR/release.cer" "$KS_DIR/selfsigned-bundle/release.cer"
          FP="$(sha256sum "$KS_DIR/release.cer" | cut -d' ' -f1)"
          echo "本轮 Release 用证书指纹 sha256 $FP"
          {
            echo "signing_source=$SOURCE"
            echo "signing_fingerprint=$FP"
          } >> "$GITHUB_OUTPUT"
          {
            echo "SIGNING_KEY_ALIAS=$(cat "$KS_DIR/alias.txt")"
            echo "SIGNING_KEYSTORE_BASE64=$(base64 -w0 "$KS_DIR/release.jks")"
            echo "SIGNING_STORE_PASSWORD=$(cat "$KS_DIR/storepass.txt")"
            echo "SIGNING_KEY_PASSWORD=$(cat "$KS_DIR/keypass.txt")"
          } >> "$GITHUB_ENV"

      - name: 签名 release APK
        # 供上传签名 APK 步产文件。入参来自准备签名证书步写入的 env，两条证书路在此合流，
        # 口令与 base64 只经 env 传递不进日志；BUILD_TOOLS_VERSION 供动作内 zipalign 与 apksigner。
        if: env.BUILD_RELEASE == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: mobile-app/src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ env.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ env.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ env.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ env.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: 上传签名 release APK
        # 传给调用方与 GitHub Release 附资产步。发布轮必须见到签名产物，缺文件即判红，不再 warn 放行。
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-android-release-signed
          path: mobile-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-signed.apk
          if-no-files-found: error

      - name: 上传临时自签证书 bundle
        # 仅准备签名证书步判为临时生成时执行。存 keystore 与口令与别名与证书原件，
        # 存到本 run 的产物 bingxi-erp-android-selfsigned-keystore，供转正式 secret 后跨轮固定。
        if: steps.signing.outputs.signing_source == 'selfsigned'
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-android-selfsigned-keystore
          path: ${{ runner.temp }}/bingxi-signing/selfsigned-bundle/
          if-no-files-found: error
          retention-days: 7

  android-e2e:
    # E2E 开关只认输入值，不再用 event_name 猜是否被调用（可复用工作流里 event_name 是调用方事件，旧写法恒真导致被传 false 也照跑）。
    # 被调用时读输入 run_e2e，调用方显式传字符串 false 即跳过，未传按声明默认 false 跳过。
    # 手工 dispatch 读手填 run_e2e（默认 true，保持旧行为恒跑）。
    # push 与 release 直接触发无输入通道，判空不等于 false，恒运行，行为不变。
    if: ${{ inputs.run_e2e != 'false' && github.event.inputs.run_e2e != 'false' }}
    # CI 模拟器无 GPU，本 job 只验证装包，权限生效，前台，窗口，WebView 初始化与无崩溃，
    # 不做像素与点击断言，真机渲染与业务交互留真机验收。
    name: 模拟器 E2E（装包，启动，前台，WebView 初始化，无 ANR 与崩溃）
    needs: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 debug APK
        uses: actions/download-artifact@v4
        with:
          name: bingxi-erp-android-debug
          path: apk

      - name: Android Emulator 端到端
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            # runner 逐行以独立 sh 执行，跨行变量与续行均不保留。赋值守卫使用须同处一行。
            # 设备侧只核对 API 34 上仍生效的权限。maxSdkVersion 低于平台 SDK 的 uses-permission
            # 由 PackageParser 在解析期丢弃（BLUETOOTH 与 BLUETOOTH_ADMIN 为 30，READ_EXTERNAL_STORAGE 为 32，
            # WRITE_EXTERNAL_STORAGE 为 28），这四条声明的完整性由 APK 静态断言 assert-apk-permissions.py 负责。
            APK="$(find apk -name '*.apk' | head -1)"; test -n "$APK" || { echo '无 APK 产物'; exit 1; }; adb install -r "$APK"
            adb shell dumpsys package "${APP_ID}" | grep -q 'android.permission.INTERNET' || { echo 'E2E: 安装包未声明 INTERNET 联网权限'; exit 1; }
            adb shell dumpsys package "${APP_ID}" | grep -q 'android.permission.CAMERA' || { echo 'E2E: 安装包未声明 CAMERA 相机权限'; exit 1; }
            adb shell dumpsys package "${APP_ID}" | grep -q 'android.permission.BLUETOOTH_CONNECT' || { echo 'E2E: 安装包未声明 BLUETOOTH_CONNECT 蓝牙权限'; exit 1; }
            adb logcat -c; adb logcat -b crash -c; adb logcat -b events -c
            COMP="$(adb shell cmd package resolve-activity --brief "${APP_ID}" | tail -1 | tr -d '\r')"; case "$COMP" in "${APP_ID}"/*) echo "E2E: launcher 组件 $COMP" ;; *) echo "E2E: launcher 组件异常 $COMP"; exit 1 ;; esac; adb shell am start -W -n "$COMP" || { echo 'E2E: 启动 launcher 组件失败'; exit 1; }
            sleep 8
            adb shell pidof "${APP_ID}" | tr -d '\r' | grep -q . || { echo 'E2E: 应用进程未存活'; exit 1; }
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -q "${APP_ID}/" || { echo 'E2E: 目标 Activity 未处于前台'; adb shell dumpsys activity activities | tail -40; exit 1; }
            adb shell dumpsys window windows | grep -q "${APP_ID}/" || { echo 'E2E: 应用窗口未创建'; exit 1; }
            adb shell run-as "${APP_ID}" true || { echo 'E2E: run-as 不可用，debug 包应可调试'; exit 1; }
            i=0; WV=""; while [ "$i" -lt 30 ]; do i=$((i+1)); adb shell run-as "${APP_ID}" ls shared_prefs 2>/dev/null | grep -qi webview && { WV=1; break; }; sleep 3; done; test -n "$WV" || { echo 'E2E: 本应用 WebView 未初始化（shared_prefs 内无 WebView 首选项）'; adb logcat -d | tail -50; exit 1; }; echo 'E2E: 本应用 WebView 已初始化'
            adb logcat -d --pid="$(adb shell pidof -s "${APP_ID}" | tr -d '\r')" | tail -20
            echo '===== crash buffer 全文 ====='; adb logcat -d -b crash
            adb logcat -d -b crash | grep -qE 'FATAL EXCEPTION|Fatal signal' && { echo 'E2E: 本次启动发生崩溃见 crash buffer'; exit 1; } || true
            adb logcat -d -b events | grep -q "am_anr.*${APP_ID}" && { echo 'E2E: 应用发生 ANR'; exit 1; } || true
            adb logcat -d -b events | grep -q "am_crash.*${APP_ID}" && { echo 'E2E: 应用发生进程崩溃事件'; exit 1; } || true
            echo 'E2E: 装包，启动，前台，WebView 初始化，无 ANR 与崩溃 全部通过'
