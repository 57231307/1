# Bingxi ERP 安卓客户端（Tauri v2）CI 自动构建可安装 APK。
#
# 出包策略：部署服务器地址由 App 首次登录时用户手填（不在此烘进包）；CI 只负责"安卓端
# 有没有被改动 → 要不要更新出 APK"。因此按 mobile-app/** 变更路径过滤触发，构建并上传安装包。
# 独立于 ci-cd.yml。本机无 Android 工具链，无法本地编译，APK 一律在 CI 出。
#
# 产物：
#   - debug APK：默认可构建、可直接安装，无需签名密钥 ⇒ 始终有可安装包。
#   - release APK：仅在 dispatch 勾选或发 release 且已配签名密钥时产出并签名。
#
# 安全：仅受信触发（无 pull_request，避免 fork 注入）；不使用 GitHub event 载荷拼命令。
# 首跑校准点（靠 CI 迭代）：NDK/build-tools/tauri 版本、Android 产物路径。
name: Android (Tauri)

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建签名 release APK（需已配置签名密钥）"
        type: boolean
        default: false
  push:
    branches:
      - "feat/android-tauri-client"
    paths:
      - "mobile-app/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  release:
    types: [published]

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "26.1.10909125"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  android-apk:
    name: 检测安卓端变更并自动出包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 记录安卓端版本（是否更新的依据）
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' mobile-app/src-tauri/Cargo.toml | tr -d ' "' | cut -d= -f2)"
          echo "android_client_version=$ver" >> "$GITHUB_ENV"
          {
            echo "## 安卓端出包"
            echo "- 客户端版本：$ver"
            echo "- 触发提交：${GITHUB_SHA::7}"
            echo "- 事件：$GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置 Android SDK / NDK / build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }}"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 设置 Rust 与 Android 目标三元组
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 初始化 Android 工程
        working-directory: mobile-app
        run: cargo tauri android init

      - name: 构建 debug APK（默认可安装包）
        working-directory: mobile-app
        env:
          NDK_HOME: ${{ format('{0}/ndk/{1}', env.ANDROID_HOME, env.NDK_VERSION) }}
        run: cargo tauri android build --debug --apk

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-android-debug-${{ env.android_client_version }}
          path: mobile-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 构建 release APK（未签名）
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_release) || github.event_name == 'release' }}
        working-directory: mobile-app
        env:
          NDK_HOME: ${{ format('{0}/ndk/{1}', env.ANDROID_HOME, env.NDK_VERSION) }}
        run: cargo tauri android build --release --apk

      - name: 签名 release APK（需 keystore 密钥）
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_release) || github.event_name == 'release' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: mobile-app/src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: 上传签名 release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_release) || github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: bingxi-erp-android-release-signed-${{ env.android_client_version }}
          path: mobile-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-signed.apk
          if-no-files-found: warn
