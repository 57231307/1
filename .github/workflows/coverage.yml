# ==============================================================================
# 单独收集 Rust 覆盖率。
#
# 为什么从 ci-cd.yml 搬出来：这个 job 要做一次插桩编译，并把 10 个分区已经跑完的同一套
# nextest 再执行一遍（run 4858 实测 52.8min）。它留在主轮里既不产出判定结论（步骤名自陈
# "信息性收集（不阻塞 CI）"），又与那 82 个 job 抢同一份 runner 并发额度、把整轮墙钟的尾巴
# 拉长。搬出后覆盖率只在每日定时与手工触发时收集：PR 轮不再为它付机时，
# 合并门也不再被一个观测项卡住。主干 push 已不是本 workflow 的触发事件（合并 PR 不自动跑主线）。
#
# 判据来源：通过/失败/跳过/总计四个计数一律取 nextest 自己输出的 Summary 行，判定器复用
# `scripts/ci/nextest-summary.sh`（与 ci-cd.yml 各测试 job 同一个脚本，避免副本过期）。
# 真实测试失败仍是信息性、不阻塞；但拿不到 Summary 行（编译失败或进程中途崩溃，本轮根本没跑成）
# 判红退出，因为那时有 0/0/0 会被下游读成"全部通过"。
# 调用方：每日定时与手工触发。入参：无（直接读工作区源码）。
# 存什么：行覆盖率（cargo llvm-cov 写 backend/coverage/cobertura.xml）与上述四项计数。
# 存哪里：runner 临时目录 + artifact（保留 30 天）+ Codecov + step summary。
# ==============================================================================
name: 📊 Rust 覆盖率（单独收集）

on:
  # 主干 push 不再触发（合并 PR 不自动跑主线），覆盖率靠每日定时与手工触发两条腿。
  schedule:
    # UTC 18:20 = 北京 02:20，每天一次；要改频率只动这一行。
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与 ci-cd.yml 的 workflow 级 env 同源。缺这块就是 run 1/2 的失败原文：
  # dtolnay/rust-toolchain 报 "'toolchain' is a required input"，因为 composite action
  # 取的是 env.RUST_VERSION，而它此前只定义在 ci-cd.yml 顶层。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_VERSION: "1.94.1"
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never

defaults:
  run:
    shell: bash

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==============================================================================
  # Rust 覆盖率（信息性观测；已移出 PR 主轮，见本文件顶层 on）
  #
  # 2026-09-22 结论：本 job 的插桩编译【不能】复用 ci-build-test-artifacts 的产物，
  # 已核对两侧产出与需求，不是"没优化"：
  #   · ci-build-test-artifacts 上传的唯一产物是 `nextest-archive`
  #     （backend/nextest-archive.tar.zst，见该 job 的"上传 archive"步），里面装的是
  #     `cargo nextest archive` 打出的**普通（未插桩）**测试可执行文件 + 元数据。
  #   · 覆盖率数据只在 `-C instrument-coverage` 编译出的二进制运行时才会产出 .profraw
  #     （cargo llvm-cov 再把它 merge 成 .profdata/cobertura.xml）。未插桩的二进制跑一百遍
  #     也不会写出任何 profraw ⇒ 没有"事后补插桩/从 archive 反推覆盖率"的路径。
  #   · 因此插桩编译是第二次全量编译，无法靠下载产物省掉。真要省，只能反过来让
  #     ci-build-test-artifacts 产出插桩 archive 并让 ci-test-rust 的 10 个分片直接跑插桩
  #     二进制（测试变慢、内存峰值更高，且 ci-test-rust 从门禁 job 变成插桩 job），
  #     收益不成立 —— 保留现状，只消除"工具链/缓存层"的重复（见下）。
  # 已消除的重复：
  #   · 工具链与缓存统一走 ./.github/actions/setup-rust（rustup-/cargo- 与主 CI 同 key，
  #     registry 依赖与 ~/.rustup 不再各自维护一套缓存）；
  #   · sccache: 'false' —— 插桩编译的 RUSTFLAGS 与普通编译不同，sccache 命中不了，
  #     开着只会白装白占内存（插桩编译内存峰值更高，配 mem_per_unit_gb: '7'）；
  #   · taiki-e/install-action 固定到与 setup-rust 同一版本 v2.56.0（原来是浮动 @v2）。
  # ==============================================================================
  ci-coverage-rust:
    name: 📊 Rust 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # 触发由本文件顶层的 on 决定（main push / 每日定时 / 手工），所以这里不再有 job 级 if；
    # 也没有 needs：本 job 自己检出、自己插桩编译、自己跑整套测试，不依赖主轮任何 job。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingxi
          POSTGRES_PASSWORD: bingxi_test
          POSTGRES_DB: bingxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bingxi:bingxi_test@localhost:5432/bingxi_test
      AUDIT_SECRET_KEY: ci-only-audit-signing-key-do-not-use-in-prod-32b
      # CARGO_BUILD_JOBS/CARGO_JOBS 由 setup-rust 智能探测写入 GITHUB_ENV（防 OOM，用满最大上限）
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust（llvm-tools-preview + 系统依赖含 postgresql-client）
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          system-deps: pkg-config libssl-dev postgresql-client protobuf-compiler
          sccache: 'false'
          # 覆盖率跑 cargo llvm-cov nextest 重编译+插桩，内存峰值高，用 7GB/单元（16GB→1 安全）
          mem_per_unit_gb: '7'

      - name: 安装 cargo-llvm-cov 与 cargo-nextest
        # 固定到与 ./.github/actions/setup-rust 内 sccache 安装同一版本（原为浮动 @v2）
        uses: taiki-e/install-action@0eee80d37f55e834144deec670972c19e81a85b0 # v2.56.0
        with:
          tool: cargo-llvm-cov,nextest

      - name: 收集覆盖率（cargo llvm-cov nextest，信息性）
        working-directory: backend
        # cargo llvm-cov nextest 一条命令完成"插桩编译 + 跑全部测试 + 收集 profraw +
        # 合并出 cobertura"；编译走 setup-rust 恢复的 registry/工具链缓存，但插桩产物
        # 落在独立的插桩 target 目录，不会污染其它 job 复用的普通 target 缓存。
        # --no-fail-fast 确保全部跑完，信息性收集覆盖率，不阻塞 CI
        run: |
          mkdir -p reports coverage
          set +e
          cargo llvm-cov nextest \
            --cobertura --output-path coverage/cobertura.xml \
            --no-clean \
            --test-threads=1 \
            --no-fail-fast \
            > reports/llvm-cov-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          # 计数取 nextest 的 Summary 行（权威），判定器与 ci-cd.yml 各测试 job 共用同一脚本。
          # 旧写法 `awk '/^ PASS /'` 与 `/^ FAIL /` 锚在行首，而 nextest 状态行带缩进
          # （`        FAIL [ … ]`），两个计数器恒为 0，真实失败被报成"通过 0 / 失败 0 / 总计 0"。
          sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' reports/llvm-cov-output.txt \
            > reports/llvm-cov-output.clean.txt
          read -r PASSED FAILED SKIPPED TOTAL HAS_SUMMARY < <(
            bash "$GITHUB_WORKSPACE/scripts/ci/nextest-summary.sh" reports/llvm-cov-output.txt
          ) || {
            echo "::error::判定器 scripts/ci/nextest-summary.sh 没有产出计数行，本轮不可判，判未验证"
            exit 1
          }

          if [ "$HAS_SUMMARY" != "1" ]; then
            echo "::error::覆盖率轮次没拿到 nextest 的 Summary 行（EXIT_CODE=$EXIT_CODE），" \
              "四项计数只是状态行粗估，不得判为全通过；按未验证处理"
          elif [ "$FAILED" -gt "0" ]; then
            echo "::warning::覆盖率轮次发现 $FAILED 个测试失败（信息性收集，不阻塞）"
          else
            echo "::notice::覆盖率轮次 nextest 全通过（$PASSED 通过，$SKIPPED 跳过，$TOTAL 总计）"
          fi

          COVERAGE_SUMMARY="N/A"
          if [ -f coverage/cobertura.xml ]; then
            LINE_RATE=$(grep -o 'line-rate="[^"]*"' coverage/cobertura.xml | head -1 | cut -d'"' -f2 || true)
            if [ -n "$LINE_RATE" ]; then
              COVERAGE_PCT=$(awk -v r="$LINE_RATE" 'BEGIN{printf "%.2f", r*100}')
              COVERAGE_SUMMARY="${COVERAGE_PCT}%"
            fi
          fi

          {
            echo "# Rust 覆盖率报告"
            echo ""
            echo "**生成时间**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')  "
            echo "**通过**: $PASSED  "
            echo "**失败**: $FAILED  "
            echo "**跳过**: $SKIPPED  "
            echo "**总计**: $TOTAL  "
            echo "**计数来源**: $( [ "$HAS_SUMMARY" = "1" ] && echo 'nextest Summary 行（权威）' || echo '状态行粗估（没拿到 Summary，不可信）' )  "
            echo "**行覆盖率**: $COVERAGE_SUMMARY  "
            echo "**EXIT_CODE**: $EXIT_CODE  "
            echo "**模式**: 信息性收集（真实失败不阻塞 CI；没拿到 Summary 行判未验证并退出非零）"
            echo ""
            if [ "$HAS_SUMMARY" != "1" ]; then
              echo "## ❌ 本轮未验证：nextest 没输出 Summary 行"
              echo ""
              echo "多为插桩编译失败或进程中途崩溃，测试根本没跑完，上面的计数不可当作"
              echo '"全通过"。失败清单退化为按状态行的粗估：'
              echo ""
              { grep -E "^[[:space:]]+(EXECUTION )?FAIL" reports/llvm-cov-output.clean.txt 2>/dev/null || true; } | head -30
            elif [ "$FAILED" -gt "0" ]; then
              echo "## ⚠️ 发现 $FAILED 个测试失败（信息性，不阻塞）"
              echo ""
              { grep -E "^[[:space:]]+FAIL \[" reports/llvm-cov-output.clean.txt 2>/dev/null || true; } | head -30
            fi
            echo ""
            echo "**覆盖率**: $COVERAGE_SUMMARY"
          } > reports/coverage-report.md

          {
            echo "## 📊 Rust 覆盖率"
            echo ""
            echo "📊 行覆盖率：$COVERAGE_SUMMARY"
            if [ "$HAS_SUMMARY" != "1" ]; then
              echo "❌ 本轮未验证：没拿到 nextest 的 Summary 行，计数不可信（EXIT_CODE=$EXIT_CODE）"
            elif [ "$FAILED" -gt "0" ]; then
              echo "⚠️  $FAILED 个测试失败（信息性，不阻塞）"
            else
              echo "✅ $PASSED 通过，$SKIPPED 跳过，$TOTAL 总计"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 真实测试失败按本 job 既有裁定只记录不阻塞；但"判定器没拿到 Summary 行"不是观测
          # 结果而是这一轮没跑成，必须判红，否则 0/0/0 会被 Codecov 与报告页当全通过发布。
          if [ "$HAS_SUMMARY" != "1" ]; then
            exit 1
          fi
          exit 0

      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: backend/coverage/cobertura.xml
          fail_ci_if_error: false
          flags: rust
          name: rust-coverage

      - name: 上传覆盖率报告 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage-report
          path: |
            backend/reports/
            backend/coverage/
          retention-days: 30
