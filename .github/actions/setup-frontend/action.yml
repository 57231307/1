# Composite action：统一前端 Node.js + npm 缓存 + npm ci（消除 7 个 job 重复配置）
name: Setup Frontend
description: 统一安装 Node.js 与 npm 缓存并执行 npm ci，供各 job 复用
inputs:
  skip-install:
    description: '跳过 npm ci（仅装 Node.js + 缓存，不装依赖）'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: 安装 Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 缓存 npm
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          frontend/node_modules
          ~/.npm
        key: fe-npm-${{ hashFiles('frontend/package-lock.json') }}
        # restore-keys：lockfile 变更后仍能复用上一份 node_modules 的大部分内容，
        # 避免每次改依赖都要 30+ 个 job 全量重装
        restore-keys: |
          fe-npm-

    - name: 安装前端依赖
      if: inputs.skip-install == 'false'
      working-directory: frontend
      shell: bash
      run: npm ci --prefer-offline --no-audit
