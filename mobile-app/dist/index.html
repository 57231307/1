<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 补 viewport-fit=cover 后 env 安全区内嵌量才会真实下发，安卓 15 起系统强制
         沉浸式布局，WebView 铺到状态栏底下，卡片页须自行按安全区避让 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bingxi ERP · 服务器设置</title>
    <style>
      :root {
        color-scheme: light dark;
        /* 安全区内嵌量，本页是壳内独立文档引不到主应用的 theme.css，
           按同款口径自行声明，env 在无切口设备回空串故以 0px 兜底，桌面取 0 零变化 */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        box-sizing: border-box;
        /* vh 行在前兜底旧内核，dvh 行在后跟随可视区 */
        min-height: 100vh;
        min-height: 100dvh;
        /* 卡片居中排布，四周按安全区加 16 像素留白，短屏下输入框不被状态栏或导航条吃掉 */
        padding: calc(var(--safe-top) + 16px) calc(var(--safe-right) + 16px)
          calc(var(--safe-bottom) + 16px) calc(var(--safe-left) + 16px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f2f5;
      }
      .card {
        width: min(92vw, 380px);
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 6px 24px rgba(0, 21, 41, 0.12);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.hint {
        margin: 0 0 18px;
        color: #64748b;
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
      }
      .btn {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        background: #409eff;
        color: #fff;
      }
      .btn.secondary {
        background: #fff;
        color: #409eff;
        border: 1px solid #409eff;
      }
      .err {
        color: #d9484b;
        font-size: 13px;
        min-height: 18px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>连接服务器</h1>
      <p class="hint">请填写 Bingxi ERP 的部署地址（含 http/https）。配好之后每次启动会自动连接。</p>
      <div id="saved" style="display: none">
        <p id="savedText" style="font-size: 14px; color: #334155"></p>
        <button class="btn" id="enterBtn">进入</button>
        <button class="btn secondary" id="changeBtn">更改服务器地址</button>
      </div>
      <!-- 连不上时的重试面板，配置窗在连续多次连不上之前不出现，改地址的入口留在页内备用户主动使用 -->
      <div id="retry" style="display: none">
        <p class="hint" id="retryText" style="margin-bottom: 12px"></p>
        <button class="btn" id="retryBtn" type="button">重试连接</button>
        <button class="btn secondary" id="retryChangeBtn" type="button">更改服务器地址</button>
      </div>
      <form id="form" style="display: none">
        <label for="url">服务器地址</label>
        <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://erp.example.com" />
        <button class="btn" type="submit">保存并进入</button>
      </form>
      <div class="err" id="err"></div>
    </div>
    <script src="./gateway.js"></script>
  </body>
</html>
