[package]
name = "bingxi-backend"
version = "2026.810.1"
edition = "2024"
# SeaORM 2.0.2 要求 Rust 1.94.0+
rust-version = "1.94"
authors = ["Bingxi Team"]
description = "Bingxi Management Platform - Rust 后端服务"

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["json", "multipart", "macros", "ws"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header"] }
# bytes crate（axum 0.8 ws::Message 使用 bytes::Bytes/BytesMut，需要显式声明依赖）
bytes = "1.0"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }
# V15 P2 B05-P2-5：后台定时任务优雅停机 Token（cancel() 通知循环退出，abort() 仅兜底）
tokio-util = { version = "0.7", features = ["rt"] }

# 数据库
# SeaORM 2.0.2 + SeaQuery 1.0
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio", "macros", "with-rust_decimal", "with-chrono"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 认证与安全
argon2 = "0.5"
uuid = { version = "1.0", default-features = false, features = ["serde", "v4"] }
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
# URL 解析（用于 SSRF 防护：解析 Webhook URL 主机名后校验内网地址）
url = "2.5"

# 验证
validator = { version = "0.21", features = ["derive"] }
regex = "1.10"

# 配置
config = "0.15"
# 加载 .env 文件（漏洞 #12 修复：统一 is_production 配置来源 APP_ENV）
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 时间 - 纯Rust实现
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# 小数处理
rust_decimal = { version = "1.0", features = ["serde"] }

# gRPC

# 错误处理
thiserror = "2.0"

# HTTP 客户端
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "stream"] }

# 进程内 LRU 缓存
moka = { version = "0.12", features = ["future"] }

# Redis 客户端（P12 批 1 性能优化：缓存层 connection-manager）
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }

# 全局单例
once_cell = "1.20"

# Base64编码
base64 = "0.22"

# ZIP 压缩
zip = "2.2"

# 时间类型（axum-extra Cookie::max_age 需要 time::Duration，axum-extra 不 re-export）
time = { version = "0.3", features = ["macros"] }

# PDF 生成
printpdf = "0.7"

# 监控
prometheus = "0.13"
# 系统信息（健康检查的内存/磁盘/uptime 真实数据）
sysinfo = "0.31"

# 并发数据结构
dashmap = "6.2"

# V15 P0-B17（Batch 484）：主备切换原子替换 DatabaseConnection
arc-swap = "1.7"

# 其他
futures = "0.3"

# 额外工具

# CLI 工具
clap = { version = "4.4", features = ["derive"] }

# API 文档
utoipa = { version = "5.2.0", features = ["axum_extras", "chrono"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private", "cookie-key-expansion"] }
totp-rs = { version = "6.0", features = ["qr", "gen_secret"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
percent-encoding = "2.3.1"
fastrand = "2.4.0"
hex = "0.4.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"



# CSV处理（仅内部调试格式，面向用户的导出已升级为 xlsx）
csv = "1.3"

# Excel 处理（v11 批次 142：规则 3 强制要求所有导出使用 xlsx 格式）
rust_xlsxwriter = "0.98"
# Excel 读取（v11 批次 157d-4：规则 3 强制要求导入使用 xlsx 格式）
calamine = "0.36"
# Word 文档生成（V15 P1 batch-08 缺陷 8：规则 3 强制要求合同/发票/报表支持 .docx 格式）
docx-rs = "0.4"

# Excel处理
migration = { version = "0.1.0", path = "migration" }

# 事件总线（Kafka 后端，rskafka 0.5 纯 Rust 实现，无 C/C++ 依赖）
rskafka = { version = "0.5", default-features = false }

# 异步 trait（Redis 缓存层使用）
async-trait = "0.1"

# 性能基准测试（V15 Batch 487 P0-T07）
# 必须放在 [dependencies] 而非 [dev-dependencies]，因为 Cargo 不允许 dev-dependencies 为 optional
# optional = true 避免在 default features 下编译 criterion，减少 CI cargo test/build 编译时间
# 运行性能基准：cargo bench --features bench
criterion = { version = "0.5", features = ["async_tokio"], optional = true }

[dev-dependencies]
# 开发测试相关依赖
tokio-test = "0.4"
mockall = "0.12"
tower = "0.5"
# 测试环境使用 SQLite
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio"] }
# 测试用 Decimal 字面量宏
rust_decimal_macros = "1.34"

[build-dependencies]

# 性能基准测试配置（V15 Batch 487 P0-T07）
# 4 项关键 service 性能基准：库存核算 / 凭证生成 / 染整成本归集 / 产量工资计算
# required-features = ["bench"] 确保 cargo test 不会编译 bench 文件
# 文件名规则：benches/{name}.rs，name 带 _bench 后缀明确标识基准文件
[[bench]]
name = "inventory_calculation_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "voucher_generation_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "dye_cost_collection_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "wage_calculation_bench"
harness = false
required-features = ["bench"]

[[bin]]
name = "server"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = 0

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
lto = false

[[bin]]
name = "hash_password"
path = "src/bin/hash_password.rs"

[[bin]]
name = "bingxi"
path = "src/bin/cli.rs"

[workspace]
members = [".", "migration"]

[features]
default = []
swagger = ["utoipa-swagger-ui"]
# 性能基准测试 feature（V15 Batch 487 P0-T07）
# 启用后编译 criterion + benches/ 目录下的基准测试
# 运行：cargo bench --features bench
bench = ["criterion"]
# OpenTelemetry 集成 feature
otel = []

# Lint 配置（clippy 1.81+ 顶层 warn 数组已弃用，改用 Cargo.toml [lints] 段）
# - [lints.rust]    段配置标准 rustc lint（如 dead_code、unused_*）
# - [lints.clippy]  段配置 clippy 自有 lint
# 死代码策略：CI 强制（见 .clippy.toml 注释与项目规则）
[lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

