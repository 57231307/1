# gitleaks allowlist：测试样例/文档示例中的假凭据 + 历史遗留路径（非现行泄露）
#
# 背景（2026-09-10 CI 首跑，run 34408962085/34410406420）：
# - 全历史扫描（fetch-depth 0，3095 commits）命中两类告警：
#   1) mask_pii 单测的 access_token 样例 / docs 的 curl 示例 / trace_id 测试串（合成数据）
#   2) 生产服务器日志/*.log 与 dist/ 旧测试包——2026-06 曾误提交，文档治理时已从
#      工作区删除，但 git 历史中仍存在（历史重写需 force-push main，待用户决策）
# - default 规则保持全量启用，本文件仅做路径/regex 级豁免

[extend]
useDefault = true

[allowlist]
description = "测试与文档合成凭据 + 已删除的历史遗留路径"
paths = [
  '''(^|/)tests?/''',
  '''\.md$''',
  '''mask_pii|pii_mask''',
  '''trace_context|tracing''',
  '''example\.com''',
  '''生产服务器日志/''',
  '''^dist/''',
  '''^快速部署/''',
  '''backend/config\.yaml$''',
  '''backend/out\.txt$''',
  '''debug_request\.js$''',
]
regexes = [
  '''REDACTED''',
  '''trace_id=[0-9a-f]{16}|span_id=[0-9a-f]{16}''',
  '''example|placeholder|change-me|dummy|sample|test-token|fake-token|ci-setup-wizard-real-token''',
]
