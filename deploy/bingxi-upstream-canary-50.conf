# V15 P1 20.7-A：灰度发布 nginx upstream 配置 - 50% 流量到新版本（green）
# 用法：ln -sf /etc/nginx/bingxi-upstream-canary-50.conf /etc/nginx/bingxi-upstream.active.conf && nginx -s reload
# 适用场景：10% 灰度验证通过后，扩大到 50% 流量继续验证
upstream bingxi_backend {
    server 127.0.0.1:8082 weight=1;
    server 127.0.0.1:8083 weight=1;
}
