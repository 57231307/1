# P0-D15：upstream 配置通过 include 引入，支持蓝绿部署零停机切换
# 活跃实例配置文件：/etc/nginx/bingxi-upstream.active.conf
# 切换方式：ln -sf /etc/nginx/bingxi-upstream-{blue|green}.conf /etc/nginx/bingxi-upstream.active.conf && nginx -s reload
# 首次部署需建立 symlink：ln -sf /etc/nginx/bingxi-upstream-blue.conf /etc/nginx/bingxi-upstream.active.conf
include /etc/nginx/bingxi-upstream.active.conf;

# P1-08-3 修复：80 端口强制跳转 HTTPS，启用 HSTS 安全头
server {
    listen 80;
    server_name _;

    # /.well-known/ 保留用于 Let's Encrypt 证书验证
    location /.well-known/ {
        root /usr/share/nginx/html;
    }

    # 其他所有请求 301 永久重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务（生产环境请替换域名和证书路径）
server {
    listen 443 ssl http2;
    # server_name your-domain.com www.your-domain.com;
    server_name _;

    # SSL 证书路径（生产环境请替换为实际证书路径）
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：强制浏览器使用 HTTPS 访问，有效期 1 年
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Frame-Options / X-Content-Type-Options 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态文件
    location / {
        root /opt/bingxi/frontend/dist;
        try_files $uri $uri/ /index.html;

        # 禁止缓存 HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # 缓存静态资源 (js, css, images, fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 代理（P0-D15：使用 upstream 块支持蓝绿切换）
    location /api/ {
        proxy_pass http://bingxi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
