# upstream 配置通过 include 引入（单实例直连，无蓝绿/灰度切换机制）。
# /etc/nginx/bingxi-upstream.active.conf 由 deploy.sh 自动生成（固定 127.0.0.1:8082）
include /etc/nginx/bingxi-upstream.active.conf;

# 【80 端口直接服务】部署成功后通过 80 端口访问系统（不强制 HTTPS 跳转）。
# 443 HTTPS 为可选项：证书就绪后按文件尾注释启用。
server {
    listen 80;
    server_name _;

    # /.well-known/ 保留用于 Let's Encrypt 证书验证
    location /.well-known/ {
        root /usr/share/nginx/html;
    }

    # X-Frame-Options / X-Content-Type-Options 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # V15 P3 25.1-F：gzip 压缩（减少传输体积 60-80%）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # 前端静态文件
    location / {
        root /opt/bingxi-erp/frontend/dist;
        try_files $uri $uri/ /index.html;

        # 禁止缓存 HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # 缓存静态资源 (js, css, images, fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 代理（upstream 块由 deploy.sh 生成，单实例；
    # WebSocket /api/v1/erp/ws/* 同走此段，Upgrade/Connection 头已配置）
    location /api/ {
        proxy_pass http://bingxi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ==================================================================
# HTTPS（可选）：证书就绪后按以下步骤启用
#   1. 参照 git 历史中本文件的 443 server 块（含 ssl_certificate/
#      ssl_protocols/HSTS 等完整配置），另存为 /etc/nginx/bingxi-ssl.conf，
#      并把文件内 listen 443 ssl 服务段的 root/proxy 段与本文件保持同步
#   2. 在本文件顶部加入：include /etc/nginx/bingxi-ssl.conf;
#   3. nginx -t && nginx -s reload
# ==================================================================
