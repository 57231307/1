# V15 P1 20.7-A：灰度发布 nginx upstream 配置 - 10% 流量到新版本（green）
# 用法：ln -sf /etc/nginx/bingxi-upstream-canary-10.conf /etc/nginx/bingxi-upstream.active.conf && nginx -s reload
# 适用场景：新版本上线初期，10% 用户流量验证稳定性
upstream bingxi_backend {
    server 127.0.0.1:8082 weight=9;
    server 127.0.0.1:8083 weight=1;
}
